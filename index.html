<script>
'use strict';
/* ===== Hilfen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const nf = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fq = q => { const a = Math.abs(q); return a >= 1e6 ? nf(q / 1e6, 1) + 'M' : a >= 1e3 ? nf(q / 1e3, 1) + 'k' : a >= 100 ? nf(q, 0) : a >= 10 ? nf(q, 1) : a >= 1 ? nf(q, 2) : nf(q, 3); };
const fusd = x => { if (x == null || !isFinite(x)) return '–'; const a = Math.abs(x); return a >= 1e9 ? nf(x / 1e9, 2) + ' Mrd' : a >= 1e6 ? nf(x / 1e6, 1) + ' Mio' : a >= 1e3 ? nf(x / 1e3, 0) + ' Tsd' : nf(x, 0); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r))), m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ohne Speicher */ } };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const SYMS = ['BTC', 'ETH', 'SOL', 'HYPE', 'XRP', 'DOGE', 'BNB', 'SUI', 'AVAX', 'LINK'];
const SRC = { bnf: 'Binance Perp', hl: 'Hyperliquid', bns: 'Binance Spot' };
const TFS = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3 };

const ST = Object.assign({ sym: 'BTC', src: 'bnf', tf: '5m', mode: 'chart', heat: true, bubbles: true, liq: true, delta: true, cvd: true, oi: true, tickMul: 0, domGroup: 1, gain: 1, bubMul: 1, side: true }, lsGet('tp:st', {}));
if (!lsGet('tp:st', null) && innerWidth < 900) { ST.side = false; ST.oi = false; }
const saveST = () => lsSet('tp:st', ST);
let toastT = null;
function toast(m, ms = 4000) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }

'use strict';
/* ===== Datenspeicher (alles im Browser, direkt von den Börsen) ===== */
const CAP = 400000;
const D = {
  candles: [], tfMs: TFS['5m'], hb: 1, base: 1,
  ring: { t: new Float64Array(CAP), p: new Float64Array(CAP), q: new Float32Array(CAP), s: new Int8Array(CAP), w: 0, len: 0 },
  dmap: new Map(),                 // Kerzenzeit -> [Verkauf, Kauf] (aus Trades)
  fp: { tick: 0, map: new Map() }, // Footprint: Kerzenzeit -> Map(Preisindex -> [Verkauf, Kauf])
  heat: [], bubbles: [], liqs: [], oi: [], tape: [], secs: [], thrC: { t: 0, v: 0 },

function resetData(keep) {
  D.candles = []; D.dmap = new Map(); D.fp = { tick: 0, map: new Map() }; D.tfMs = TFS[ST.tf];
  if (keep) { dmapRebuild(); return; }          // gleicher Markt, nur anderer Zeitrahmen: Trades, Heatmap, Blasen bleiben
  D.ring.w = 0; D.ring.len = 0; D.heat = []; D.bubbles = []; D.liqs = []; D.oi = []; D.tape = []; D.secs = []; D.last = null; D.stats = {}; D.book = null; D.pend = {};
}
const rIdx = i => (D.ring.w - D.ring.len + i + CAP) % CAP;    // i-ter Trade in Zeitfolge
function ringPush(t, p, q, s) { const r = D.ring; r.t[r.w] = t; r.p[r.w] = p; r.q[r.w] = q; r.s[r.w] = s; r.w = (r.w + 1) % CAP; if (r.len < CAP) r.len++; }

/* Grundtick je Preisniveau */
function baseTick(p) { return niceStep(p * 1e-5); }
function heatBucket(p) { return niceStep(p * 4e-5); }

/* Footprint */
function fpAdd(t, p, q, s) {
  const ct = Math.floor(t / D.tfMs) * D.tfMs; let m = D.fp.map.get(ct); if (!m) { m = new Map(); D.fp.map.set(ct, m); }
  const k = Math.floor(p / D.fp.tick + 1e-9); let c = m.get(k); if (!c) { c = [0, 0]; m.set(k, c); } c[s > 0 ? 1 : 0] += q;
}
function fpRebuild(tick) {
  D.fp = { tick, map: new Map() }; const r = D.ring;
  for (let i = 0; i < r.len; i++) { const j = rIdx(i); fpAdd(r.t[j], r.p[j], r.q[j], r.s[j]); }
}
function dmapAdd(t, q, s) { const ct = Math.floor(t / D.tfMs) * D.tfMs; let c = D.dmap.get(ct); if (!c) { c = [0, 0]; D.dmap.set(ct, c); } c[s > 0 ? 1 : 0] += q; }
function dmapRebuild() { D.dmap = new Map(); const r = D.ring; for (let i = 0; i < r.len; i++) { const j = rIdx(i); dmapAdd(r.t[j], r.q[j], r.s[j]); } }
function rebucket() { dmapRebuild(); if (D.fp.tick) fpRebuild(D.fp.tick); }
/* Delta einer Kerze: bevorzugt Börsenwert (Binance taker-buy), sonst aus eigenen Trades */
function deltaOf(c) { if (c.d != null) return c.d; const m = D.dmap.get(c.t); return m ? m[1] - m[0] : null; }

/* ===== Eingänge (werden von den Feeds aufgerufen) ===== */
const BUB_BASE = { BTC: 3e5, ETH: 1.5e5, SOL: 8e4, HYPE: 6e4 };
function onTrade(t, p, q, s, backfill) {
  ringPush(t, p, q, s); dmapAdd(t, q, s); if (D.fp.tick) fpAdd(t, p, q, s);
  /* Blasen: Netto je Sekunde und Seite */
  const sec = Math.floor(t / 1000), k = sec + (s > 0 ? 'b' : 's'); let pd = D.pend[k];
  if (!pd) { for (const kk in D.pend) { const o = D.pend[kk]; if (o.sec < sec - 1) { const thr = (BUB_BASE[ST.sym] || 1e5); D.secs.push(o.usd); if (D.secs.length > 1500) D.secs.shift(); if (o.usd >= thr * 0.15) D.bubbles.push({ t: o.sec * 1000 + 500, p: o.pq / o.q, usd: o.usd, s: o.s }); delete D.pend[kk]; } } pd = D.pend[k] = { sec, s, usd: 0, pq: 0, q: 0 }; }
  pd.usd += p * q; pd.pq += p * q; pd.q += q;
  if (D.bubbles.length > 6000) D.bubbles.splice(0, 1000);
  if (!backfill) {
    D.last = { t, p, s }; D.lastMsg = Date.now(); const lt = D.lastMsg - t; if (lt > -5000 && lt < 60000) { (D.lat = D.lat || []).push(lt); if (D.lat.length > 300) D.lat.shift(); }

}
function onCandles(arr) { D.candles = arr; if (arr.length) { const pr = arr[arr.length - 1].c; D.base = baseTick(pr); D.hb = heatBucket(pr); } }
function onCandle(c) {
  const a = D.candles, l = a[a.length - 1];
  if (!l || c.t > l.t) { a.push(c); if (a.length > 3000) a.shift(); } else if (c.t === l.t) a[a.length - 1] = c; else { const i = a.findIndex(x => x.t === c.t); if (i >= 0) a[i] = c; }
  D.lastMsg = Date.now(); if (!D.last) D.last = { t: c.t, p: c.c, s: 0 };
}
function onLiq(ev) { D.liqs.push(ev); if (D.liqs.length > 2000) D.liqs.shift(); }
function onStats(o) { Object.assign(D.stats, o); if (o.oiUsd != null) { const l = D.oi[D.oi.length - 1], t = Date.now(); if (!l || t - l.t > 15e3) D.oi.push({ t, v: o.oiUsd }); if (D.oi.length > 5000) D.oi.shift(); } }
function onOIHist(rows) { const keep = D.oi.filter(x => !rows.length || x.t > rows[rows.length - 1].t); D.oi = rows.concat(keep); }

/* Heatmap-Spalte aus dem aktuellen Orderbuch (1 Hz) */
function sampleHeat() {
  const f = D.feed; if (!f || !f.getBook) return;
  const bk = f.getBook(); if (!bk || !bk.bids.length || !bk.asks.length) return;
  D.book = bk; const mid = (bk.bids[0][0] + bk.asks[0][0]) / 2, hb = D.hb, m = new Map(), rng = mid * 0.012;
  const add = (arr) => { for (let i = 0; i < arr.length; i++) { const [p, q] = arr[i]; if (Math.abs(p - mid) > rng) continue; const step = bk.step;
    if (step && step > hb * 1.5) { const n = Math.max(1, Math.round(step / hb)), b0 = Math.floor((p - step / 2) / hb), v = p * q / n; for (let k = 0; k < n; k++) m.set(b0 + k, (m.get(b0 + k) || 0) + v); }
    else { const b = Math.floor(p / hb); m.set(b, (m.get(b) || 0) + p * q); } } };
  add(bk.bids); add(bk.asks);
  const idx = new Int32Array(m.size), val = new Float32Array(m.size); let i = 0; for (const [k, v] of m) { idx[i] = k; val[i++] = v; }
  D.heat.push({ t: Date.now(), mid, idx, val }); if (D.heat.length > 7200) D.heat.splice(0, 600);
}

/* Blasen-Schwelle: adaptiv (oberes Dreißigstel der Sekunden-Umsätze der letzten Minuten), mindestens ein Sockelwert */
function bubThr() {
  const now = Date.now(); if (now - D.thrC.t < 4000 && D.thrC.v) return D.thrC.v / ST.bubMul;
  const base = (BUB_BASE[ST.sym] || 1e5) * 0.5; let v = base;
  if (D.secs.length > 60) { const a = D.secs.slice().sort((x, y) => x - y); v = Math.max(base, a[Math.floor(a.length * 0.97)]); }
  D.thrC = { t: now, v }; return v / ST.bubMul;
}

'use strict';
/* ===== Börsen-Anbindung: direkt aus dem Browser (öffentliche Daten, keine Schlüssel) ===== */
const jget = async (u, o) => { const r = await fetch(u, o); if (!r.ok) throw new Error(u.split('?')[0] + ' → HTTP ' + r.status); return r.json(); };

/* WebSocket mit Wiederverbindung und Ausweich-Adressen */
class WS {
  constructor(urls, onmsg, onopen, onstate) { this.urls = urls; this.onmsg = onmsg; this.onopen = onopen; this.onstate = onstate || (() => {}); this.n = 0; this.dead = false; this.ui = 0; this.connect(); }
  connect() {
    if (this.dead) return;
    const url = this.urls[this.ui % this.urls.length]; let ws, opened = false;
    try { ws = new WebSocket(url); } catch (e) { this.retry(); return; }
    this.ws = ws; this.onstate('verbinde');
    ws.onopen = () => { opened = true; this.n = 0; this.onstate('ok'); this.onopen && this.onopen(ws); };
    ws.onmessage = e => { try { this.onmsg(JSON.parse(e.data)); } catch (err) { /* unbekannte Nachricht ignorieren */ } };
    ws.onclose = () => { if (this.dead) return; this.onstate('getrennt'); if (!opened) this.ui++; this.retry(); };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* */ } };
  }
  retry() { if (this.dead) return; this.n++; setTimeout(() => this.connect(), Math.min(10000, 500 * Math.pow(1.7, this.n))); }
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  close() { this.dead = true; try { this.ws && this.ws.close(); } catch (e) { /* */ } }
}

/* ---------- Binance (Perp oder Spot) ---------- */
class BinanceFeed {
  constructor(sym, tf, spot, gen) {
    this.sym = sym; this.tf = tf; this.spot = spot; this.gen = gen; this.S = sym.toLowerCase() + 'usdt'; this.SYM = sym + 'USDT';
    this.rest = spot ? 'https://api.binance.com/api/v3' : 'https://fapi.binance.com/fapi/v1';
    this.ws = []; this.timers = []; this.buf = []; this.live = false; this.bk = { b: new Map(), a: new Map() }; this.snapDone = false; this.evBuf = []; this.first = false; this.prevU = 0; this.snapId = 0;
    this.status = {};

  alive() { return D.gen === this.gen; }
  async start() {

    if (!this.alive()) return;
    onCandles(k.map(r => ({ t: r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4], v: +r[5], d: 2 * +r[9] - +r[5] })));
    if (D.candles.length) D.last = { t: Date.now(), p: D.candles[D.candles.length - 1].c, s: 0 };
    /* 2) WebSockets (Trades werden gepuffert, bis der Rückblick geladen ist) */
    const trade = m => { const t = m.T, p = +m.p, q = +m.q, s = m.m ? -1 : 1; if (!this.live) this.buf.push([t, p, q, s]); else onTrade(t, p, q, s, false); this.pulse('trades'); };
    const kline = m => { const x = m.k; onCandle({ t: x.t, o: +x.o, h: +x.h, l: +x.l, c: +x.c, v: +x.v, d: 2 * +x.V - +x.v }); this.pulse('kline'); };
    const liq = m => { const o = m.o; if (!o) return; const p = +(o.ap > 0 ? o.ap : o.p), q = +o.q; onLiq({ t: o.T, p, q, usd: p * q, long: o.S === 'SELL' }); };
    const route = m => { const d = m.data || m, e = d.e; if (e === 'aggTrade') trade(d); else if (e === 'kline') kline(d); else if (e === 'forceOrder') liq(d); else if (e === 'depthUpdate') this.onDepth(d); };
    const st = key => s => { this.status[key] = s; };
    if (this.spot) {
      const q = S + '@aggTrade/' + S + '@kline_' + iv + '/' + S + '@depth@100ms';
      this.ws.push(new WS(['wss://stream.binance.com:9443/stream?streams=' + q, 'wss://stream.binance.com/stream?streams=' + q], route, null, st('ws')));
    } else {
      const q1 = S + '@aggTrade/' + S + '@kline_' + iv + '/' + S + '@forceOrder', q2 = S + '@depth@100ms';
      this.ws.push(new WS(['wss://fstream.binance.com/market/stream?streams=' + q1, 'wss://fstream.binance.com/stream?streams=' + q1], route, null, st('ws')));
      this.ws.push(new WS(['wss://fstream.binance.com/public/stream?streams=' + q2, 'wss://fstream.binance.com/stream?streams=' + q2], route, () => { this.snapDone = false; this.syncBook(); }, st('depth')));
    }
    if (this.spot) this.ws[0].onopen = () => this.syncBook();
    /* 3) Trade-Rückblick (letzte Minuten) für Footprint/Delta */
    this.backfill().catch(() => {}).finally(() => {
      if (!this.alive()) return; const lastT = D.ring.len ? D.ring.t[rIdx(D.ring.len - 1)] : 0;
      for (const b of this.buf) if (b[0] > lastT) onTrade(b[0], b[1], b[2], b[3], false); this.buf = []; this.live = true;

  }
  pulse(k) { this.status[k] = Date.now(); }
  async backfill() {
    const mins = 12; const lastR = D.ring.len ? D.ring.t[rIdx(D.ring.len - 1)] + 1 : 0; let from = Math.max(lastR, Date.now() - mins * 60e3); const end = Date.now();
    for (let i = 0; i < 40 && this.alive(); i++) {

      if (!r.length) break;

    for (const [p, q] of ev.a) { const k = +p, v = +q; if (v === 0) this.bk.a.delete(k); else this.bk.a.set(k, v); }
  }
  resync() { if (this.rs) return; this.rs = true; this.snapDone = false; setTimeout(() => { this.rs = false; this.syncBook(); }, 500); }
  getBook() {
    const b = [...this.bk.b], a = [...this.bk.a]; if (!b.length || !a.length) return null;
    b.sort((x, y) => y[0] - x[0]); a.sort((x, y) => x[0] - y[0]);

    while (b.length && a.length && b[0][0] >= a[0][0]) { if (b[0][1] <= a[0][1]) b.shift(); else a.shift(); }

  }

}

/* ---------- Hyperliquid ---------- */
class HLFeed {
  constructor(sym, tf, gen) { this.sym = sym; this.tf = tf; this.gen = gen; this.timers = []; this.bk = null; this.status = {}; }
  alive() { return D.gen === this.gen; }
  info(body) { return jget('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  async start() {
    const ms = TFS[this.tf], now = Date.now();
    const k = await this.info({ type: 'candleSnapshot', req: { coin: this.sym, interval: this.tf, startTime: now - 1000 * ms, endTime: now } });
    if (!this.alive()) return;
    onCandles(k.map(x => ({ t: x.t, o: +x.o, h: +x.h, l: +x.l, c: +x.c, v: +x.v, d: null })));
    if (D.candles.length) D.last = { t: Date.now(), p: D.candles[D.candles.length - 1].c, s: 0 };
    const sf = this.sym === 'BTC' ? 4 : this.sym === 'ETH' ? 4 : 4;
    const route = m => {

      else if (c === 'l2Book') { if (d.coin !== this.sym) return; this.bk = { b: d.levels[0].map(x => [+x.px, +x.sz]), a: d.levels[1].map(x => [+x.px, +x.sz]) }; this.status.depth = Date.now(); }
      else if (c === 'candle') { onCandle({ t: d.t, o: +d.o, h: +d.h, l: +d.l, c: +d.c, v: +d.v, d: null }); this.status.kline = Date.now(); }
    };
    this.ws = new WS(['wss://api.hyperliquid.xyz/ws'], route, ws => {
      for (const sub of [{ type: 'trades', coin: this.sym }, { type: 'l2Book', coin: this.sym, nSigFigs: sf }, { type: 'candle', coin: this.sym, interval: this.tf }]) this.ws.send({ method: 'subscribe', subscription: sub });
    }, s => { this.status.ws = s; });
    this.pollStats(); this.timers.push(setInterval(() => this.pollStats(), 10000));
    this.timers.push(setInterval(() => this.ws && this.ws.send({ method: 'ping' }), 30000));
  }

  }

    if (!this.alive()) return;

      const c = r[1][i], mark = +c.markPx;
      onStats({ mark, chg: (mark / +c.prevDayPx - 1) * 100, fund8: +c.funding * 800, oiUsd: +c.openInterest * mark, vol24: +c.dayNtlVlm });
      this.status.rest = Date.now();
    } catch (e) { this.status.rest = 0; }
  }
  stop() { this.ws && this.ws.close(); this.timers.forEach(clearInterval); }
}

/* ===== Verbindung (neu) aufbauen ===== */
let lastKey = '';
async function connect() {

  if (D.feed) D.feed.stop(); D.gen++; resetData(keep); D.fp.tick = 0;
  if (ST.sym === 'HYPE' && ST.src === 'bns') { ST.src = 'hl'; lastKey = ''; }
  const gen = D.gen, tf = ST.tf; setLoading(true);

  const feed = ST.src === 'hl' ? new HLFeed(ST.sym, tf, gen) : new BinanceFeed(ST.sym, tf, ST.src === 'bns', gen);
  D.feed = feed;
  const tStart = Date.now();
  try { await feed.start(); if (D.gen === gen && D.restoredHb && D.restoredHb !== D.hb) D.heat = D.heat.filter(c => c.t >= tStart); }
  catch (e) {
    if (D.gen !== gen) return;
    console.error(e);
    if (ST.src !== 'hl') { toast(SRC[ST.src] + ' nicht erreichbar (' + (e && e.message ? e.message : e) + ') – wechsle zu Hyperliquid.', 6000); ST.src = 'hl'; lastKey = ''; saveST(); syncUI(); connect(); return; }

const PKEY = () => ST.sym + '|' + ST.src, KEEP_TRADES = 150000, KEEP_HEAT = 3600, MAX_AGE = 6 * 3600e3;

/* ----- Statistik ----- */
function perf(list) {
  const n = list.length, w = list.filter(c => c.pnl > 0), l = list.filter(c => c.pnl <= 0), gp = w.reduce((x, c) => x + c.pnl, 0), gl = -l.reduce((x, c) => x + c.pnl, 0), chron = list.slice().reverse();
  let eq = NX.acct.eq0, pk = eq, dd = 0; const curve = [eq]; for (const c of chron) { eq += c.pnl; curve.push(eq); pk = Math.max(pk, eq); dd = Math.max(dd, (pk - eq) / pk); }
  return { n, win: n ? w.length / n : 0, avgR: mean(list.map(c => c.R)), pnl: list.reduce((x, c) => x + c.pnl, 0), pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0), dd, curve, fees: list.reduce((x, c) => x + c.fees, 0) };
}

function bestNow() {

function groupBy(list, f) { const m = new Map(); for (const x of list) { const k = f(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); } return m; }
function suggestions() {
  const s = []; for (const a of ALGOS) { const c = algoCfg(a.id); for (const v of VARS) { const st = algoStats(a.id, v), vd = algoVerdict(st);
    if (vd.k === 'verw' && c.trade && c.tv === v) s.push({ t: E(a.name) + ' · ' + v + ' hat nach n=' + st.n + ' keinen Vorteil (Ø ' + pn(st.avg, 2) + ' R). Vorschlag: nicht mehr handeln.', apply: () => cfgSet('algos.' + a.id + '.trade', false, 'Lernvorschlag') });
    if (vd.k === 'kand' && !(c.trade && c.tv === v)) s.push({ t: E(a.name) + ' · ' + v + ' ist Kandidat (konservativ ' + pn(st.lo, 2) + ' R, n=' + st.n + '). Vorschlag: diese Variante handeln.', apply: () => { cfgSet('algos.' + a.id + '.tv', v, 'Lernvorschlag'); cfgSet('algos.' + a.id + '.trade', true, 'Lernvorschlag'); } }); } }
  const p = perf(NX.closed); if (p.n >= 10 && p.fees > Math.abs(p.pnl) * 0.5 && p.pnl < p.fees * 3) s.push({ t: 'Gebühren fressen ' + nf(p.fees, 2) + ' $ bei ' + nf(p.pnl, 2) + ' $ Ergebnis. Vorschlag: weniger Trades / nur Signale mit größerem Ziel.', apply: null });
  return s;

  return card('Positionsgrößen-Rechner', '<div class="fields">' + inp('c_eq', 'Equity $', Math.round(equity())) + inp('c_rp', 'Risiko %', NX.risk.riskPct) + inp('c_en', 'Einstieg', D.last ? String(D.last.p) : '') + inp('c_st', 'Stop', '') + inp('c_fe', 'Gebühr bp', feeOf(ST.src)) + '</div>' + res);

/* Watchlist: 24h-Kennzahlen + Mini-Verlauf (1h-Kerzen, 48 Stück) */

    if (ST.src === 'hl') {
      const r = await hlInfo({ type: 'metaAndAssetCtxs' }); const U = r[0].universe, X = r[1];
      for (const s of WL_SYMS) { const i = U.findIndex(u => u.name === s); if (i < 0) continue; const c = X[i], m = +c.markPx; MI.wl[s] = Object.assign(MI.wl[s] || {}, { px: m, chg: (m / +c.prevDayPx - 1) * 100, vol: +c.dayNtlVlm, fund: +c.funding * 800, oi: +c.openInterest * m, t: Date.now() }); }
      for (const s of WL_SYMS.slice(0, 6)) { if (MI.wl[s] && MI.wl[s].sp && Date.now() - MI.wl[s].spT < 300e3) continue; try { const k = await hlInfo({ type: 'candleSnapshot', req: { coin: s, interval: '1h', startTime: Date.now() - 48 * 3600e3, endTime: Date.now() } }); if (MI.wl[s]) { MI.wl[s].sp = k.map(x => +x.c); MI.wl[s].spT = Date.now(); } } catch (e) { /* */ } }
    } else {
      const base = bnBase(), all = await jget(base + '/ticker/24hr'); const by = {}; for (const t of all) by[t.symbol] = t;
      for (const s of WL_SYMS) { const t = by[s + 'USDT']; if (!t) continue; MI.wl[s] = Object.assign(MI.wl[s] || {}, { px: +t.lastPrice, chg: +t.priceChangePercent, vol: +t.quoteVolume, hi: +t.highPrice, lo: +t.lowPrice, t: Date.now() }); }
      if (ST.src === 'bnf') { try { const pi = await jget(base + '/premiumIndex'); for (const p of pi) { const s = p.symbol.replace('USDT', ''); if (MI.wl[s] && p.symbol.endsWith('USDT')) { MI.wl[s].fund = +p.lastFundingRate * 100; MI.wl[s].mark = +p.markPrice; MI.wl[s].idx = +p.indexPrice; } } } catch (e) { /* */ } }
      for (const s of WL_SYMS) { if (!MI.wl[s] || (MI.wl[s].sp && Date.now() - MI.wl[s].spT < 300e3)) continue; try { const k = await jget(base + '/klines?symbol=' + s + 'USDT&interval=1h&limit=48'); MI.wl[s].sp = k.map(r => +r[4]); MI.wl[s].spT = Date.now(); } catch (e) { /* */ } }
