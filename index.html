<script>
'use strict';
/* ===== Hilfen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const nf = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fq = q => { const a = Math.abs(q); return a >= 1e6 ? nf(q / 1e6, 1) + 'M' : a >= 1e3 ? nf(q / 1e3, 1) + 'k' : a >= 100 ? nf(q, 0) : a >= 10 ? nf(q, 1) : a >= 1 ? nf(q, 2) : nf(q, 3); };
const fusd = x => { if (x == null || !isFinite(x)) return '–'; const a = Math.abs(x); return a >= 1e9 ? nf(x / 1e9, 2) + ' Mrd' : a >= 1e6 ? nf(x / 1e6, 1) + ' Mio' : a >= 1e3 ? nf(x / 1e3, 0) + ' Tsd' : nf(x, 0); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r))), m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ohne Speicher */ } };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const SYMS = ['BTC', 'ETH', 'SOL', 'HYPE', 'XRP', 'DOGE', 'BNB', 'SUI', 'AVAX', 'LINK'];
const SRC = { bnf: 'Binance Perp', hl: 'Hyperliquid', bns: 'Binance Spot' };
const TFS = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3 };

const ST = Object.assign({ sym: 'BTC', src: 'bnf', tf: '5m', mode: 'chart', heat: true, bubbles: true, liq: true, delta: true, cvd: true, oi: true, tickMul: 0, domGroup: 1, gain: 1, bubMul: 1, side: true }, lsGet('tp:st', {}));
if (!lsGet('tp:st', null) && innerWidth < 900) { ST.side = false; ST.oi = false; }
const saveST = () => lsSet('tp:st', ST);
/* Messpunkte für Observability (Modul 13) / API-Verwaltung (Modul 16) */
const OBS = { rest: {}, ws: {}, nT: 0, nM: 0, resync: 0, reconn: 0, errs: [], draw: [], ts: [], alerts: [], tick: 0, saveOk: 0, saveErr: 0, t0: Date.now() };
function obsRest(h, ms, ok, st) { const r = OBS.rest[h] || (OBS.rest[h] = { n: 0, err: 0, ms: [], at: [], last: 0, lastErr: '' }); r.n++; if (!ok) { r.err++; r.lastErr = 'HTTP ' + st; } r.ms.push(ms); if (r.ms.length > 100) r.ms.shift(); const now = Date.now(); r.at.push([now, ok ? 1 : 0]); while (r.at.length && now - r.at[0][0] > 60000) r.at.shift(); r.last = now; }
addEventListener('error', e => { OBS.errs.unshift({ t: Date.now(), m: String(e.message || e) }); if (OBS.errs.length > 50) OBS.errs.length = 50; });

OBS.brk = {};
const JOBS = {};
function jt(n, f) { const t0 = performance.now(); try { return f(); } finally { const j = JOBS[n] || (JOBS[n] = { n: 0, ms: [], last: 0 }); j.n++; j.last = Date.now(); j.ms.push(performance.now() - t0); if (j.ms.length > 60) j.ms.shift(); } }
let toastT = null;
function toast(m, ms = 4000) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }

'use strict';
/* ===== Datenspeicher (alles im Browser, direkt von den Börsen) ===== */
const CAP = 400000;
const D = {
  candles: [], tfMs: TFS['5m'], hb: 1, base: 1,
  ring: { t: new Float64Array(CAP), p: new Float64Array(CAP), q: new Float32Array(CAP), s: new Int8Array(CAP), w: 0, len: 0 },
  dmap: new Map(),                 // Kerzenzeit -> [Verkauf, Kauf] (aus Trades)
  fp: { tick: 0, map: new Map() }, // Footprint: Kerzenzeit -> Map(Preisindex -> [Verkauf, Kauf])
  heat: [], bubbles: [], liqs: [], oi: [], tape: [], secs: [], thrC: { t: 0, v: 0 },
  last: null, stats: {}, feed: null, gen: 0, book: null, lastMsg: 0, pend: {},
};
function resetData(keep) {
  D.candles = []; D.dmap = new Map(); D.fp = { tick: 0, map: new Map() }; D.tfMs = TFS[ST.tf];
  if (keep) { dmapRebuild(); return; }          // gleicher Markt, nur anderer Zeitrahmen: Trades, Heatmap, Blasen bleiben
  D.ring.w = 0; D.ring.len = 0; D.heat = []; D.bubbles = []; D.liqs = []; D.oi = []; D.tape = []; D.secs = []; D.last = null; D.stats = {}; D.book = null; D.pend = {};
}
const rIdx = i => (D.ring.w - D.ring.len + i + CAP) % CAP;    // i-ter Trade in Zeitfolge
function ringPush(t, p, q, s) { const r = D.ring; r.t[r.w] = t; r.p[r.w] = p; r.q[r.w] = q; r.s[r.w] = s; r.w = (r.w + 1) % CAP; if (r.len < CAP) r.len++; }

/* Grundtick je Preisniveau */
function baseTick(p) { return niceStep(p * 1e-5); }
function heatBucket(p) { return niceStep(p * 4e-5); }

/* Footprint */
function fpAdd(t, p, q, s) {
  const ct = Math.floor(t / D.tfMs) * D.tfMs; let m = D.fp.map.get(ct); if (!m) { m = new Map(); D.fp.map.set(ct, m); }
  const k = Math.floor(p / D.fp.tick + 1e-9); let c = m.get(k); if (!c) { c = [0, 0]; m.set(k, c); } c[s > 0 ? 1 : 0] += q;
}
function fpRebuild(tick) {
  D.fp = { tick, map: new Map() }; const r = D.ring;
  for (let i = 0; i < r.len; i++) { const j = rIdx(i); fpAdd(r.t[j], r.p[j], r.q[j], r.s[j]); }
}
function dmapAdd(t, q, s) { const ct = Math.floor(t / D.tfMs) * D.tfMs; let c = D.dmap.get(ct); if (!c) { c = [0, 0]; D.dmap.set(ct, c); } c[s > 0 ? 1 : 0] += q; }
function dmapRebuild() { D.dmap = new Map(); const r = D.ring; for (let i = 0; i < r.len; i++) { const j = rIdx(i); dmapAdd(r.t[j], r.q[j], r.s[j]); } }
function rebucket() { dmapRebuild(); if (D.fp.tick) fpRebuild(D.fp.tick); }
/* Delta einer Kerze: bevorzugt Börsenwert (Binance taker-buy), sonst aus eigenen Trades */
function deltaOf(c) { if (c.d != null) return c.d; const m = D.dmap.get(c.t); return m ? m[1] - m[0] : null; }
function volsOf(c) { const m = D.dmap.get(c.t); return m ? m : null; }

/* ===== Eingänge (werden von den Feeds aufgerufen) ===== */
const BUB_BASE = { BTC: 3e5, ETH: 1.5e5, SOL: 8e4, HYPE: 6e4 };
function onTrade(t, p, q, s, backfill) {
  ringPush(t, p, q, s); dmapAdd(t, q, s); if (D.fp.tick) fpAdd(t, p, q, s);
  /* Blasen: Netto je Sekunde und Seite */
  const sec = Math.floor(t / 1000), k = sec + (s > 0 ? 'b' : 's'); let pd = D.pend[k];
  if (!pd) { for (const kk in D.pend) { const o = D.pend[kk]; if (o.sec < sec - 1) { const thr = (BUB_BASE[ST.sym] || 1e5); D.secs.push(o.usd); if (D.secs.length > 1500) D.secs.shift(); if (o.usd >= thr * 0.15) D.bubbles.push({ t: o.sec * 1000 + 500, p: o.pq / o.q, usd: o.usd, s: o.s }); delete D.pend[kk]; } } pd = D.pend[k] = { sec, s, usd: 0, pq: 0, q: 0 }; }
  pd.usd += p * q; pd.pq += p * q; pd.q += q;
  if (D.bubbles.length > 6000) D.bubbles.splice(0, 1000);
  if (!backfill) {
    D.last = { t, p, s }; D.lastMsg = Date.now(); OBS.nT++; const lt = D.lastMsg - t; if (lt > -5000 && lt < 60000) { (D.lat = D.lat || []).push(lt); if (D.lat.length > 300) D.lat.shift(); }
    D.tape.push({ t, p, q, s }); if (D.tape.length > 80) D.tape.shift();
  }
}
function onCandles(arr) { D.candles = arr; if (arr.length) { const pr = arr[arr.length - 1].c; D.base = baseTick(pr); D.hb = heatBucket(pr); } }
function onCandle(c) {
  const a = D.candles, l = a[a.length - 1];
  if (!l || c.t > l.t) { a.push(c); if (a.length > 3000) a.shift(); } else if (c.t === l.t) a[a.length - 1] = c; else { const i = a.findIndex(x => x.t === c.t); if (i >= 0) a[i] = c; }
  D.lastMsg = Date.now(); if (!D.last) D.last = { t: c.t, p: c.c, s: 0 };
}
function onLiq(ev) { D.liqs.push(ev); if (D.liqs.length > 2000) D.liqs.shift(); }
function onStats(o) { Object.assign(D.stats, o); if (o.oiUsd != null) { const l = D.oi[D.oi.length - 1], t = Date.now(); if (!l || t - l.t > 15e3) D.oi.push({ t, v: o.oiUsd }); if (D.oi.length > 5000) D.oi.shift(); } }
function onOIHist(rows) { const keep = D.oi.filter(x => !rows.length || x.t > rows[rows.length - 1].t); D.oi = rows.concat(keep); }

/* Heatmap-Spalte aus dem aktuellen Orderbuch (1 Hz) */
function sampleHeat() {
  if (NX.flags && NX.flags.heat === false) return; const f = D.feed; if (!f || !f.getBook) return;
  const bk = f.getBook(); if (!bk || !bk.bids.length || !bk.asks.length) return;
  D.book = bk; const mid = (bk.bids[0][0] + bk.asks[0][0]) / 2, hb = D.hb, m = new Map(), rng = mid * 0.012;
  const add = (arr) => { for (let i = 0; i < arr.length; i++) { const [p, q] = arr[i]; if (Math.abs(p - mid) > rng) continue; const step = bk.step;
    if (step && step > hb * 1.5) { const n = Math.max(1, Math.round(step / hb)), b0 = Math.floor((p - step / 2) / hb), v = p * q / n; for (let k = 0; k < n; k++) m.set(b0 + k, (m.get(b0 + k) || 0) + v); }
    else { const b = Math.floor(p / hb); m.set(b, (m.get(b) || 0) + p * q); } } };
  add(bk.bids); add(bk.asks);
  const idx = new Int32Array(m.size), val = new Float32Array(m.size); let i = 0; for (const [k, v] of m) { idx[i] = k; val[i++] = v; }
  D.heat.push({ t: Date.now(), mid, idx, val }); if (D.heat.length > 7200) D.heat.splice(0, 600);
}

/* Blasen-Schwelle: adaptiv (oberes Dreißigstel der Sekunden-Umsätze der letzten Minuten), mindestens ein Sockelwert */
function bubThr() {
  const now = Date.now(); if (now - D.thrC.t < 4000 && D.thrC.v) return D.thrC.v / ST.bubMul;
  const base = (BUB_BASE[ST.sym] || 1e5) * 0.5; let v = base;
  if (D.secs.length > 60) { const a = D.secs.slice().sort((x, y) => x - y); v = Math.max(base, a[Math.floor(a.length * 0.97)]); }
  D.thrC = { t: now, v }; return v / ST.bubMul;
}

'use strict';
/* ===== Börsen-Anbindung: direkt aus dem Browser (öffentliche Daten, keine Schlüssel) ===== */
const jget = async (u, o) => { const t0 = performance.now(), h = u.split('/')[2]; let r; if (OBS.brk && OBS.brk[h] > Date.now()) throw new Error(h + ' → Leistungsschalter offen'); try { r = await fetch(u, o); } catch (e) { obsRest(h, performance.now() - t0, false, 0); throw e; } obsRest(h, performance.now() - t0, r.ok, r.status); if (!r.ok) throw new Error(u.split('?')[0] + ' → HTTP ' + r.status); return r.json(); };

/* WebSocket mit Wiederverbindung und Ausweich-Adressen */
class WS {
  constructor(urls, onmsg, onopen, onstate) { this.urls = urls; this.onmsg = onmsg; this.onopen = onopen; this.onstate = onstate || (() => {}); this.n = 0; this.dead = false; this.ui = 0; this.connect(); }
  connect() {
    if (this.dead) return;
    const url = this.urls[this.ui % this.urls.length]; let ws, opened = false;
    try { ws = new WebSocket(url); } catch (e) { this.retry(); return; }
    this.ws = ws; this.onstate('verbinde');
    ws.onopen = () => { opened = true; this.n = 0; this.onstate('ok'); this.onopen && this.onopen(ws); };
    ws.onmessage = e => { OBS.nM++; const wh = url.split('/')[2], w = OBS.ws[wh] || (OBS.ws[wh] = { n: 0, conn: 0, last: 0 }); w.n++; w.last = Date.now(); try { this.onmsg(JSON.parse(e.data)); } catch (err) { /* unbekannte Nachricht ignorieren */ } };
    ws.onclose = () => { if (this.dead) return; OBS.reconn++; (OBS.ws[url.split('/')[2]] || (OBS.ws[url.split('/')[2]] = { n: 0, conn: 0, last: 0 })).conn++; this.onstate('getrennt'); if (!opened) this.ui++; this.retry(); };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* */ } };
  }
  retry() { if (this.dead) return; this.n++; setTimeout(() => this.connect(), Math.min(10000, 500 * Math.pow(1.7, this.n))); }
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  close() { this.dead = true; try { this.ws && this.ws.close(); } catch (e) { /* */ } }
}

/* ---------- Binance (Perp oder Spot) ---------- */
class BinanceFeed {
  constructor(sym, tf, spot, gen) {
    this.sym = sym; this.tf = tf; this.spot = spot; this.gen = gen; this.S = sym.toLowerCase() + 'usdt'; this.SYM = sym + 'USDT';
    this.rest = spot ? 'https://api.binance.com/api/v3' : 'https://fapi.binance.com/fapi/v1';
    this.ws = []; this.timers = []; this.buf = []; this.live = false; this.bk = { b: new Map(), a: new Map() }; this.snapDone = false; this.evBuf = []; this.first = false; this.prevU = 0; this.snapId = 0;
    this.status = {};
  }
  alive() { return D.gen === this.gen; }
  async start() {
    const iv = this.tf, S = this.S;
    /* 1) Kerzen-Historie inkl. Taker-Kaufvolumen (=> echtes Delta je Kerze) */
    const k = await jget(this.rest + '/klines?symbol=' + this.SYM + '&interval=' + iv + '&limit=1000');
    if (!this.alive()) return;
    onCandles(k.map(r => ({ t: r[0], o: +r[1], h: +r[2], l: +r[3], c: +r[4], v: +r[5], d: 2 * +r[9] - +r[5] })));
    if (D.candles.length) D.last = { t: Date.now(), p: D.candles[D.candles.length - 1].c, s: 0 };
    /* 2) WebSockets (Trades werden gepuffert, bis der Rückblick geladen ist) */
    const trade = m => { const t = m.T, p = +m.p, q = +m.q, s = m.m ? -1 : 1; if (!this.live) this.buf.push([t, p, q, s]); else onTrade(t, p, q, s, false); this.pulse('trades'); };
    const kline = m => { const x = m.k; onCandle({ t: x.t, o: +x.o, h: +x.h, l: +x.l, c: +x.c, v: +x.v, d: 2 * +x.V - +x.v }); this.pulse('kline'); };
    const liq = m => { const o = m.o; if (!o) return; const p = +(o.ap > 0 ? o.ap : o.p), q = +o.q; onLiq({ t: o.T, p, q, usd: p * q, long: o.S === 'SELL' }); };
    const route = m => { const d = m.data || m, e = d.e; if (e === 'aggTrade') trade(d); else if (e === 'kline') kline(d); else if (e === 'forceOrder') liq(d); else if (e === 'depthUpdate') this.onDepth(d); };
    const st = key => s => { this.status[key] = s; };
    if (this.spot) {
      const q = S + '@aggTrade/' + S + '@kline_' + iv + '/' + S + '@depth@100ms';
      this.ws.push(new WS(['wss://stream.binance.com:9443/stream?streams=' + q, 'wss://stream.binance.com/stream?streams=' + q], route, null, st('ws')));
    } else {
      const q1 = S + '@aggTrade/' + S + '@kline_' + iv + '/' + S + '@forceOrder', q2 = S + '@depth@100ms';
      this.ws.push(new WS(['wss://fstream.binance.com/market/stream?streams=' + q1, 'wss://fstream.binance.com/stream?streams=' + q1], route, null, st('ws')));
      this.ws.push(new WS(['wss://fstream.binance.com/public/stream?streams=' + q2, 'wss://fstream.binance.com/stream?streams=' + q2], route, () => { this.snapDone = false; this.syncBook(); }, st('depth')));
    }
    if (this.spot) this.ws[0].onopen = () => this.syncBook();
    /* 3) Trade-Rückblick (letzte Minuten) für Footprint/Delta */
    this.backfill().catch(() => {}).finally(() => {
      if (!this.alive()) return; const lastT = D.ring.len ? D.ring.t[rIdx(D.ring.len - 1)] : 0;
      for (const b of this.buf) if (b[0] > lastT) onTrade(b[0], b[1], b[2], b[3], false); this.buf = []; this.live = true;
    });
    /* 4) Kennzahlen */
    this.pollStats(); this.timers.push(setInterval(() => this.pollStats(), 10000));
    if (!this.spot) this.oiHist();
  }
  pulse(k) { this.status[k] = Date.now(); }
  async backfill() {
    const mins = 12; const lastR = D.ring.len ? D.ring.t[rIdx(D.ring.len - 1)] + 1 : 0; let from = Math.max(lastR, Date.now() - mins * 60e3); const end = Date.now();
    for (let i = 0; i < 40 && this.alive(); i++) {
      const r = await jget(this.rest + '/aggTrades?symbol=' + this.SYM + '&startTime=' + from + '&limit=1000');
      if (!r.length) break;
      for (const x of r) onTrade(x.T, +x.p, +x.q, x.m ? -1 : 1, true);
      from = r[r.length - 1].T + 1; if (r.length < 1000 || from >= end) break; await sleep(60);
    }
  }
  /* Lokales Orderbuch nach Binance-Vorschrift: Snapshot + Diff-Stream */
  async syncBook() {
    if (!this.alive()) return; this.snapDone = false; this.first = false; this.evBuf = [];
    try {
      const s = await jget(this.rest + '/depth?symbol=' + this.SYM + '&limit=1000'); if (!this.alive()) return;
      this.bk = { b: new Map(s.bids.map(x => [+x[0], +x[1]])), a: new Map(s.asks.map(x => [+x[0], +x[1]])) }; this.snapId = s.lastUpdateId; this.snapDone = true;
      const buf = this.evBuf; this.evBuf = []; for (const ev of buf) this.applyDepth(ev);
    } catch (e) { setTimeout(() => this.syncBook(), 3000); }
  }
  onDepth(ev) { if (!this.snapDone) { this.evBuf.push(ev); if (this.evBuf.length > 2000) this.evBuf.shift(); return; } this.applyDepth(ev); this.pulse('depth'); }
  applyDepth(ev) {
    if (this.spot ? ev.u <= this.snapId : ev.u < this.snapId) return;
    if (!this.first) { const ok = this.spot ? (ev.U <= this.snapId + 1 && ev.u >= this.snapId + 1) : (ev.U <= this.snapId && ev.u >= this.snapId); if (!ok) { this.resync(); return; } this.first = true; }
    else { const ok = this.spot ? ev.U === this.prevU + 1 : ev.pu === this.prevU; if (!ok) { this.resync(); return; } }
    this.prevU = ev.u;
    for (const [p, q] of ev.b) { const k = +p, v = +q; if (v === 0) this.bk.b.delete(k); else this.bk.b.set(k, v); }
    for (const [p, q] of ev.a) { const k = +p, v = +q; if (v === 0) this.bk.a.delete(k); else this.bk.a.set(k, v); }
  }
  resync() { OBS.resync++; if (this.rs) return; this.rs = true; this.snapDone = false; setTimeout(() => { this.rs = false; this.syncBook(); }, 500); }
  getBook() {
    const b = [...this.bk.b], a = [...this.bk.a]; if (!b.length || !a.length) return null;
    b.sort((x, y) => y[0] - x[0]); a.sort((x, y) => x[0] - y[0]);
    /* übergekreuzte Reste (veraltet) entfernen */
    while (b.length && a.length && b[0][0] >= a[0][0]) { if (b[0][1] <= a[0][1]) b.shift(); else a.shift(); }
    return { bids: b, asks: a, step: null };
  }
  async pollStats() {
    if (!this.alive()) return;
    try {
      const t = await jget(this.rest + '/ticker/24hr?symbol=' + this.SYM); onStats({ chg: +t.priceChangePercent, vol24: +t.quoteVolume });
      if (!this.spot) {
        const [pi, oi] = await Promise.all([jget(this.rest + '/premiumIndex?symbol=' + this.SYM), jget(this.rest + '/openInterest?symbol=' + this.SYM)]);
        onStats({ mark: +pi.markPrice, index: +pi.indexPrice, fund8: +pi.lastFundingRate * 100, oiUsd: +oi.openInterest * +pi.markPrice });
      }
      this.status.rest = Date.now();
    } catch (e) { this.status.rest = 0; }
  }
  async oiHist() {
    try { const r = await jget('https://fapi.binance.com/futures/data/openInterestHist?symbol=' + this.SYM + '&period=5m&limit=500'); if (this.alive()) onOIHist(r.map(x => ({ t: x.timestamp, v: +x.sumOpenInterestValue }))); } catch (e) { /* ohne OI-Historie */ }
  }
  stop() { this.ws.forEach(w => w.close()); this.timers.forEach(clearInterval); }
}

/* ---------- Hyperliquid ---------- */
class HLFeed {
  constructor(sym, tf, gen) { this.sym = sym; this.tf = tf; this.gen = gen; this.timers = []; this.bk = null; this.status = {}; }
  alive() { return D.gen === this.gen; }
  info(body) { return jget('https://api.hyperliquid.xyz/info', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
  async start() {
    const ms = TFS[this.tf], now = Date.now();
    const k = await this.info({ type: 'candleSnapshot', req: { coin: this.sym, interval: this.tf, startTime: now - 1000 * ms, endTime: now } });
    if (!this.alive()) return;
    onCandles(k.map(x => ({ t: x.t, o: +x.o, h: +x.h, l: +x.l, c: +x.c, v: +x.v, d: null })));
    if (D.candles.length) D.last = { t: Date.now(), p: D.candles[D.candles.length - 1].c, s: 0 };
    const sf = this.sym === 'BTC' ? 4 : this.sym === 'ETH' ? 4 : 4;
    const route = m => {
      const c = m.channel, d = m.data; if (!d) return;
      if (c === 'trades') { for (const x of d) if (x.coin === this.sym) onTrade(x.time, +x.px, +x.sz, x.side === 'B' ? 1 : -1, false); this.status.trades = Date.now(); }
      else if (c === 'l2Book') { if (d.coin !== this.sym) return; this.bk = { b: d.levels[0].map(x => [+x.px, +x.sz]), a: d.levels[1].map(x => [+x.px, +x.sz]) }; this.status.depth = Date.now(); }
      else if (c === 'candle') { onCandle({ t: d.t, o: +d.o, h: +d.h, l: +d.l, c: +d.c, v: +d.v, d: null }); this.status.kline = Date.now(); }
    };
    this.ws = new WS(['wss://api.hyperliquid.xyz/ws'], route, ws => {
      for (const sub of [{ type: 'trades', coin: this.sym }, { type: 'l2Book', coin: this.sym, nSigFigs: sf }, { type: 'candle', coin: this.sym, interval: this.tf }]) this.ws.send({ method: 'subscribe', subscription: sub });
    }, s => { this.status.ws = s; });
    this.pollStats(); this.timers.push(setInterval(() => this.pollStats(), 10000));
    this.timers.push(setInterval(() => this.ws && this.ws.send({ method: 'ping' }), 30000));
  }
  getBook() {
    if (!this.bk || !this.bk.b.length || !this.bk.a.length) return null;
    const b = this.bk.b, step = b.length > 1 ? Math.abs(b[0][0] - b[1][0]) : null;
    return { bids: b, asks: this.bk.a, step };
  }
  async pollStats() {

  return '<div class="li" data-a="open:' + d.id + '"><div class="l1">' + sideC(d.side) + ' <b>' + E(algoName(d.algo)) + '</b> <span class="mut">' + E(d.variant) + ' · ' + d.sym + '</span><span class="rt">' + ago(d.t) + '</span></div><div class="l2">' + chip2(verdictT(d), verdictC(d.verdict)) + ' ' + (d.risk && d.risk.ok ? '<span class="mut">Risiko ' + nf(d.risk.riskUsd, 2) + ' $ · ' + nf(d.risk.qty, 4) + ' ' + d.sym + '</span>' : '') + (d.reasons.length ? '<div class="mut sm">' + E(d.reasons.join(' · ')) + '</div>' : '') + '</div>' +
    (d.state === 'wartet' ? '<div class="row" onclick="event.stopPropagation()">' + btnA('approve:' + d.id, 'Freigeben', 'upb') + btnA('reject:' + d.id, 'Ablehnen') + '<span class="mut sm">läuft ab in ' + Math.max(0, Math.round((180e3 - (Date.now() - d.t)) / 1000)) + ' s</span></div>' : '') +
    (o ? '<div class="det"><div class="h4">Prüfungen</div>' + d.checks.map(c => '<div>' + (c.ok ? '<span class="up">✓</span>' : '<span class="dn">✗</span>') + ' ' + E(c.n) + (c.d ? ' <span class="mut">– ' + E(c.d) + '</span>' : '') + '</div>').join('') +
      '<div class="h4">Gegenargumente</div>' + (d.challenge.length ? d.challenge.map(c => '<div>• ' + E(c) + '</div>').join('') : '<div class="mut">keine gefunden</div>') +
      '<div class="h4">Nutzen</div><div class="mut">' + (d.ev && d.ev.avg != null ? 'Vorwärts-Statistik n=' + d.ev.n + ', Ø ' + nf(d.ev.avg, 2) + ' R, konservativ ' + nf(d.ev.lo, 2) + ' R' : 'Keine belastbare Statistik (n=' + (d.ev ? d.ev.n : 0) + ') → Exploration mit ' + Math.round(d.scale * 100) + ' % Größe') + '</div>' +
      '<div class="mut sm">Kontext: ' + E(d.ctx.regime || '–') + ' · Funding ' + (d.ctx.fund != null ? nf(d.ctx.fund, 4) : '–') + ' · Bid/Ask ' + (d.ctx.imb != null ? nf(d.ctx.imb, 2) : '–') + ' · Signal ' + d.sig + ' · Entscheidung ' + d.id + (d.order ? ' · Order ' + d.order : '') + '</div></div>' : '') + '</div>';
}
function posRow(p) {
  const pxn = pxOf(p.sym, p.src), u = unreal(p), R = p.riskUsd ? (u - p.fees) / p.riskUsd : 0;
  return '<div class="li"><div class="l1">' + sideC(p.side) + ' <b>' + p.sym + '</b> <span class="mut">' + nf(p.qty, 4) + ' · ' + E(SRC[p.src]) + '</span><span class="rt ' + cl(u - p.fees) + '"><b>' + pn(u - p.fees, 2) + ' $</b> · ' + pn(R, 2) + ' R</span></div><div class="l2">Einstieg ' + px(p.entry) + ' → jetzt ' + px(pxn) + ' · Stop ' + px(p.stop) + ' · Ziel ' + px(p.target) + ' <span class="mut">· ' + dur(Date.now() - p.t0) + ' · ' + E(algoName(p.algo)) + '</span>' + (p.sym !== ST.sym || p.src !== ST.src ? ' ' + chip2('Kurs per REST', 'warn') : '') + '</div><div class="row">' + (p.closing ? chip2('schließt …', 'warn') : btnA('close:' + p.id, 'Schließen')) + '</div></div>';
}
function ordRow(o) {
  const op = NXV.open[o.id];
  return '<div class="li" data-a="open:' + o.id + '"><div class="l1">' + chip2(o.kind === 'entry' ? 'Einstieg' : 'Ausstieg', '') + ' <b>' + (o.side === 'buy' ? 'Kauf' : 'Verkauf') + ' ' + nf(o.qty, 4) + ' ' + o.sym + '</b><span class="rt">' + chip2(lblS(o.st), o.st === 'filled' ? 'up' : o.st === 'rejected' || o.st === 'cancelled' ? 'dn' : 'warn') + '</span></div><div class="l2">' + (o.filled ? 'Ø ' + px(o.avg) + ' · Gebühr ' + nf(o.fee, 3) + ' $ · ' : '') + ago(o.t) + (o.why ? ' · ' + E(o.why) : '') + '</div>' +
    (op ? '<div class="det">' + o.hist.map(h => '<div><span class="mut">' + tm(h.t) + '</span> ' + lblS(h.st) + (h.info ? ' <span class="mut">– ' + E(h.info) + '</span>' : '') + '</div>').join('') + '<div class="mut sm">ID ' + o.id + ' · Client-ID ' + E(o.cid) + ' (verhindert Doppel-Orders)</div></div>' : '') + '</div>';
}
function riskEditor() {
  return card('Limits (harte Grenzen – nicht umgehbar)', '<p class="mut sm">Diese Werte bindet die Risiko-Engine. Strategien, Signale und der Auto-Modus können sie nicht überschreiben. Jede Änderung wird protokolliert und ist rücknehmbar.</p><div class="fields">' + RISK_FIELDS.map(f => '<label class="fl"><span>' + f.l + (f.u ? ' <small>' + f.u + '</small>' : '') + '</span>' + numIn('risk.' + f.k, NX.risk[f.k], f) + '</label>').join('') + '</div><div class="row">' + btnA('costreset', 'Standardwerte') + '</div>') +
    card('Änderungsprotokoll', NX.cfgLog.length ? NX.cfgLog.slice(0, 12).map((c, i) => '<div class="li"><div class="l1"><b>' + E(c.path) + '</b> <span class="mut">' + E(String(c.old)) + ' → ' + E(String(c.val)) + '</span><span class="rt">' + ago(c.t) + '</span></div><div class="l2 mut sm">' + E(c.why) + ' ' + (c.path !== 'mode' ? btnA('cfgundo:' + i, 'Zurücknehmen') : '') + '</div></div>').join('') : empty('Noch keine Änderungen'));
}
function usageMeters() {
  const R = NX.risk, eq = equity(), dl = Math.max(0, -dayPnl()) / (R.dayLossPct / 100 * NX.acct.eq0), lev = exposure() / Math.max(1, eq) / R.maxLev, pp = NX.pos.length / R.maxPos, m = (l, v, t) => '<div class="meter"><span>' + l + '</span><div class="bar sm ' + (v > 0.8 ? 'hot' : '') + '"><i style="width:' + clamp(v * 100, 0, 100).toFixed(0) + '%"></i></div><b>' + t + '</b></div>';
  return m('Positionen', pp, NX.pos.length + ' / ' + R.maxPos) + m('Tagesverlust', dl, nf(dl * 100, 0) + ' %') + m('Hebel', lev, nf(exposure() / Math.max(1, eq), 2) + '× / ' + R.maxLev + '×');
}
function bestNow() {
  const w = NX.decisions.find(d => d.state === 'wartet'); if (w) return { t: 'Freigabe wartet', s: sideC(w.side) + ' ' + E(algoName(w.algo)) + ' ' + w.sym, a: 'go:03' };
  const o = NX.signals.find(s => s.st === 'open' && Date.now() - s.t < 15 * 60e3 && s.k === nxKey() && !s.manual); if (o) return { t: 'Aktuelles Signal', s: sideC(o.side) + ' ' + E(algoName(o.algo)) + ' (' + E(o.variant) + ') ' + ago(o.t), a: 'go:02' };
  return { t: 'Kein belastbares Setup', s: '<span class="mut">Die Algorithmen laufen. Sobald eine Bedingung erfüllt ist, erscheint es hier.</span>' };
}

/* ===================== 00 · Command Center ===================== */
const pStatus = () => card('System', '<div class="two">' + kv('Modus', { off: 'Aus (nur Signale)', ask: 'Vorschlag + Freigabe', auto: 'Auto (Papier)' }[NX.mode]) + kv('Live-Handel', 'GESPERRT', 'dn') + kv('Kill-Switch', NX.kill ? 'AKTIV' : 'aus', NX.kill ? 'dn' : 'up') + kv('Datenstrom', '<span class="' + healthC() + '">●</span> ' + (D.lastMsg ? ago(D.lastMsg) : '–')) + kv('Markt', ST.sym + ' · ' + E(SRC[ST.src]) + ' · ' + ST.tf) + kv('Pause', Date.now() < NX.pause.until ? E(NX.pause.why) : 'nein') + '</div>' + modeSwitch() + killBox());
const pMarket = () => {
  const c = marketCtx(), pe = perf(NX.closed); if (c.atr == null) return card('Markt & Portfolio', empty('Warte auf genug Kerzen …'));
  return card('Markt & Portfolio', ncHTML('mini', 250, specMini(70)) + '<div class="two">' + kv('Preis', px(c.px)) + kv('Regime', E(c.regime)) + kv('Vola (Perzentil)', c.volPct + ' %') + kv('ATR', nf(c.atrPct, 2) + ' %') + kv('Funding/8h', c.fund != null ? nf(c.fund, 4) + ' %' : '–', cl(c.fund)) + kv('Basis', c.basis != null ? nf(c.basis, 3) + ' %' : '–') + kv('OI 1 h', c.oi1h != null ? pn(c.oi1h, 2) + ' %' : '–', cl(c.oi1h)) + kv('CVD 12 Kerzen', c.cvd12 != null ? pn(c.cvd12, 0) : '–', cl(c.cvd12)) + kv('Bid/Ask ±0,25 %', c.imb != null ? nf(c.imb, 2) : '–') + kv('Spread', c.spreadBp != null ? nf(c.spreadBp, 2) + ' bp' : '–') + '</div><div class="h4">Papier-Konto</div><div class="two">' + kv('Equity', nf(equity(), 2) + ' $') + kv('Tag', pn(dayPnl(), 2) + ' $', cl(dayPnl())) + kv('Offen', NX.pos.length + ' Pos.') + kv('Trades', pe.n) + '</div>');
};
const pApprovals = () => { const w = NX.decisions.filter(d => d.state === 'wartet'); return card('Freigaben (' + w.length + ')', w.length ? w.map(decRow).join('') : empty('Nichts wartet auf dich.')); };
const pSignals = () => card('Letzte Signale', NX.signals.length ? NX.signals.slice(0, 6).map(sigRow).join('') : empty('Noch keine Signale. Die Algorithmen prüfen jede geschlossene Kerze (' + ST.tf + ') bzw. alle 5 s / 60 s.'));
const pPositions = () => card('Offene Positionen (' + NX.pos.length + ')', NX.pos.length ? NX.pos.map(posRow).join('') : empty('Keine offene Papier-Position.'));
const EV_GROUP = { signal: 'Signale', decision: 'Entscheidungen', order: 'Orders', position: 'Positionen' };
const evGroup = t => EV_GROUP[t.split('.')[0]] || 'System';
function evText(e) { const d = e.d || {}, k = Object.keys(d).filter(x => typeof d[x] !== 'object').slice(0, 5).map(x => x + ' ' + (typeof d[x] === 'number' ? +d[x].toFixed(4) : d[x])).join(' · '); return k; }
const evLine = e => '<div class="tl ' + (/veto|killswitch.on|incident.opened|mismatch|illegal|error|pause/.test(e.type) ? 'bad' : /incident.resolved|position.closed|filled/.test(e.type) ? 'ok' : '') + '"><time>' + tm(e.t) + '</time><b>' + E(e.type) + '</b><span>' + E(evText(e)) + '</span></div>';
const pRecent = () => card('Entscheidungen & Vorfälle', (NX.decisions.slice(0, 3).map(decRow).join('') || '') + '<div class="h4">Ereignisse</div>' + (NX.events.filter(e => /^(decision|risk|killswitch|incident|position|order\.(filled|rejected)|mode|reconcile)/.test(e.type)).slice(0, 8).map(evLine).join('') || empty('Noch nichts passiert.')));
const pModules = () => { const total = MODS.reduce((x, m) => x + m.s.length, 0), done = MODS.reduce((x, m) => x + (IMPL[m.id] || []).length, 0); return card('Module', '<div class="bar"><i style="width:' + (done / total * 100).toFixed(1) + '%"></i></div>' + kv('Abschnitte gebaut', done + ' / ' + total) + '<div class="row">' + btnA('go:more', 'Alle 24 Module ›') + '</div>'); };
const pPerf = () => { const p = perf(NX.closed); return card('Leistung & Lernen (Papier)', '<div class="two">' + kv('Trades', p.n) + kv('Trefferquote', p.n ? nf(p.win * 100, 0) + ' %' : '–') + kv('Ø R', p.n ? pn(p.avgR, 2) : '–', cl(p.avgR)) + kv('P&L', pn(p.pnl, 2) + ' $', cl(p.pnl)) + kv('Max. Drawdown', p.n ? nf(p.dd * 100, 1) + ' %' : '–') + kv('Gebühren', nf(p.fees, 2) + ' $') + '</div>' + ncHTML('eqC', 210, specEquity(NX.closed)) + '<p class="mut sm">Ehrlicher Hinweis: Wenige Trades sind Zufall. Aussagekraft erst ab Dutzenden Trades – siehe Lab → Validation.</p>'); };
const pLifecycle = () => {
  const rows = []; let c = { idee: 0, test: 0, kand: 0, verw: 0 }; for (const a of ALGOS) for (const v of VARS) { const st = algoStats(a.id, v), vd = algoVerdict(st); if (st.n === 0 && st.tot === 0) c.idee++; else if (vd.k === 'kand') c.kand++; else if (vd.k === 'verw') c.verw++; else c.test++; }
  return card('Strategie-Lebenszyklus (Vorwärts-Test)', '<div class="two">' + kv('Idee / ohne Signal', c.idee) + kv('im Vorwärts-Test', c.test) + kv('Kandidat (belegt)', c.kand, 'up') + kv('Verworfen', c.verw, 'dn') + '</div><p class="mut sm">Reihenfolge laut Plan: Idee → Hypothese → Vorwärts-Test → Kandidat → Freigabe. „Kein Vorteil“ ist ein gültiges Ergebnis.</p>' + btnA('go:02', 'Zum Lab ›'));
};
const pBest = () => { const b = bestNow(); return card('Gibt es jetzt einen guten Trade?', '<div class="best"><b>' + b.t + '</b><div>' + b.s + '</div>' + (b.a ? btnA(b.a, 'Ansehen ›') : '') + '</div>'); };
PANELS['00'] = {
  'Market and portfolio context': () => pMarket() + vWatch() + pPositions(),
  'NEXUS Intelligence Overview / Command Center': () => pBest() + pApprovals() + pStatus() + pMarket() + pPositions() + pSignals() + pPerf() + pRecent() + pModules(),
  'System status and module navigation': () => pStatus() + vFeeds() + pModules(),
  'Risk and execution status': () => card('Risiko-Auslastung', usageMeters() + '<div class="row">' + btnA('go:03', 'Trader ›') + '</div>') + pPositions() + killBox(),
  'Strategy lifecycle status': () => pLifecycle(),
  'Recent decisions and incidents': () => pRecent() + card('Ereignisse (alle)', NX.events.slice(0, 30).map(evLine).join('')),
  'Performance and learning summary': () => pPerf() + pLifecycle(),
};

  const f = D.feed, s = (f && f.status) || {}, row = (n, k) => kv(n, s[k] ? ago(s[k]) : '–', s[k] && Date.now() - s[k] < 20000 ? 'up' : 'dn');

}

    let rows = ''; for (const a of ALGOS) for (const v of VARS) { const { st, vd } = statRow(a, v); rows += '<tr><td>' + E(a.name) + '</td><td>' + v + '</td><td>' + st.n + (st.open ? '+' + st.open : '') + '</td><td class="' + cl(st.avg) + '">' + (st.n ? pn(st.avg, 2) : '–') + '</td><td>' + chip2(vd.t.split(' (')[0], vd.c) + '</td></tr>'; }
    return card('Stand aller Algorithmen (Vorwärts-Test)', '<p class="mut sm">Jeder Algorithmus läuft in 3 Varianten gleichzeitig auf den Live-Daten des offenen Marktes (' + ST.sym + ' · ' + ST.tf + '). Ergebnis in R (1 R = Abstand zum Stop), nach Gebühren und Slippage. Die Auswertung läuft nur, solange die App geöffnet ist.</p><div class="tw"><table class="tbl"><tr><th>Algorithmus</th><th>Variante</th><th>n</th><th>Ø R</th><th>Urteil</th></tr>' + rows + '</table></div>') + pSignals();
  },
  'Algorithms': () => ALGOS.map(a => { const c = algoCfg(a.id); return card('<span class="h">' + E(a.name) + '</span> ' + chip2(c.on ? 'läuft' : 'aus', c.on ? 'up' : ''),
    '<p class="mut sm">' + E(a.hyp) + '</p><p class="mut sm">Falsifikation: ' + E(a.falsif) + '</p><div class="row">' + btnA('algoon:' + a.id, c.on ? 'Ausschalten' : 'Einschalten') + btnA('algotrade:' + a.id, c.trade ? 'Trader nutzt: ' + c.tv + ' ✓' : 'Trader nutzt nichts') + '</div>' +
    (c.trade ? '<div class="seg2 sm">' + VARS.map(v => '<button class="' + (c.tv === v ? 'on' : '') + '" data-a="tv:' + a.id + ':' + v + '"><b>' + v + '</b></button>').join('') + '</div>' : '') +
    VARS.map(v => { const { st, vd } = statRow(a, v); return '<div class="li"><div class="l1"><b>' + v + '</b> <span class="mut">' + E(a.pdesc(a.params[v])) + '</span></div><div class="l2">n ' + st.n + ' · Treffer ' + (st.n ? nf(st.win * 100, 0) + ' %' : '–') + ' · Ø ' + (st.n ? pn(st.avg, 2) + ' R' : '–') + ' ' + chip2(vd.t, vd.c) + '</div></div>'; }).join('')); }).join('') +
    card('Geplant', '<p class="mut sm">„Spot-Perp Imbalance“ braucht zusätzlich den Spot-Datenstrom parallel zum Perp-Strom. Noch nicht gebaut.</p>'),
  'Discoveries': () => card('Gefundene Signale (' + NX.signals.length + ')', NX.signals.length ? NX.signals.slice(0, 40).map(sigRow).join('') : empty('Noch keine Signale.')),
  'Experiments': () => {
    let rows = ''; for (const a of ALGOS) for (const v of VARS) { const st = algoStats(a.id, v); rows += '<tr><td>' + E(a.name) + ' · ' + v + '</td><td>' + st.tot + '</td><td>' + st.n + '</td><td>' + st.T + '/' + st.S + '/' + st.Z + '</td><td class="' + cl(st.avg) + '">' + (st.n ? pn(st.avg, 2) : '–') + '</td><td>' + (st.lo != null ? pn(st.lo, 2) : '–') + '</td></tr>'; }
    return card('Experiment-Register (Vorwärts-Test, live)', '<p class="mut sm">Ziel / Stop / Zeit = wie die Signale endeten (Zeit = nach 60 min bewertet). „Konservativ“ = Ø − 1,28 Standardfehler. Nur Märkte, die geöffnet waren, werden ausgewertet. Es gibt keinen Backtest und keinen Blick in die Zukunft: Jedes Signal entsteht live und wird auf den danach eintreffenden Kursen bewertet.</p><div class="tw"><table class="tbl"><tr><th>Experiment</th><th>Sig.</th><th>n</th><th>Z/S/T</th><th>Ø R</th><th>konserv.</th></tr>' + rows + '</table></div>');
  },
  'Validation': () => ALGOS.map(a => card(E(a.name), VARS.map(v => { const { st, vd } = statRow(a, v), n = st.n; return '<div class="li"><div class="l1"><b>' + v + '</b> ' + chip2(vd.t, vd.c) + '</div><div class="ladder">' + [['Idee', true], ['Hypothese', true], ['Vorwärts-Test ≥ 20', n >= 20], ['Konservativ > 0 R', st.lo != null && st.lo > 0], ['Paper-Trading belegt', false], ['Freigabe', false]].map(([l, ok]) => '<span class="' + (ok ? 'ok' : '') + '">' + l + '</span>').join('') + '</div><div class="mut sm">n=' + n + (st.lo != null ? ' · Ø ' + pn(st.avg, 2) + ' R · konservativ ' + pn(st.lo, 2) + ' R' : '') + '</div></div>'; }).join('') + '<p class="mut sm">Stufen laut Evidenzleiter: Vorwärts-Test ist keine Garantie. Paper-Trading und Freigabe folgen erst, wenn mehrere Marktphasen abgedeckt sind (Regime-Analyse im Learning Lab).</p>')).join(''),
};

function calcBox() {

  const inp = (k, l, v) => '<label class="fl"><span>' + l + '</span><input type="text" inputmode="decimal" data-form="' + k + '" data-rr="1" value="' + E(f[k] != null ? f[k] : v) + '"></label>';
  let res = '<p class="mut sm">Stop eingeben.</p>'; if (st > 0 && en > 0 && dist > 0) { const risk = eq * rp / 100, qty = risk / dist, notl = qty * en, rt = 2 * notl * fe / 1e4; res = '<div class="two">' + kv('Richtung', dir > 0 ? 'Long' : 'Short', dir > 0 ? 'up' : 'dn') + kv('Risiko', nf(risk, 2) + ' $') + kv('Menge', nf(qty, 4)) + kv('Positionswert', nf(notl, 0) + ' $') + kv('Hebel', nf(notl / eq, 2) + '×') + kv('Gebühren Hin+Zurück', nf(rt, 2) + ' $ (' + nf(rt / risk, 2) + ' R)') + '</div>' + [1, 1.5, 2, 3].map(r => kv('Ziel ' + r + ' R', px(en + dir * dist * r) + ' → ' + nf(risk * r - rt, 2) + ' $ netto')).join(''); }
  return card('Positionsgrößen-Rechner', '<div class="fields">' + inp('c_eq', 'Equity $', Math.round(equity())) + inp('c_rp', 'Risiko %', NX.risk.riskPct) + inp('c_en', 'Einstieg', D.last ? String(D.last.p) : '') + inp('c_st', 'Stop', '') + inp('c_fe', 'Gebühr bp', feeOf(ST.src)) + '</div>' + res);
}

function runGroup(grp) {
  const list = TESTS.filter(t => !grp || t.grp === grp); return Promise.all(list.map(async t => { const t0 = performance.now(); let r; try { await t.fn(); r = { ok: true }; } catch (e) { r = { ok: false, m: String(e.message || e).slice(0, 160) }; } r.ms = performance.now() - t0; r.t = Date.now(); QA.res[t.grp + '|' + t.name] = r; return r; }));
}
async function qaRun(grp) {
  if (QA.running) return; QA.running = true; QA.t = Date.now(); renderNx(true);
  try { await runGroup(grp); } finally { QA.running = false; }
  const res = {}; for (const k of Object.keys(QA.res)) res[k] = QA.res[k].ok; const pass = Object.values(res).filter(Boolean).length;
  NX.qa = NX.qa || {}; NX.qa.last = { t: Date.now(), res }; emit('test.run', { grp: grp || 'alle', pass, fail: Object.keys(res).length - pass }); renderNx(true);
}
const qaOf = grp => TESTS.filter(t => t.grp === grp).map(t => ({ t, r: QA.res[t.grp + '|' + t.name] }));
function qaList(grp, title) {
  const L = qaOf(grp), done = L.filter(x => x.r), pass = done.filter(x => x.r.ok).length;
  return card(title, '<div class="r1"><b class="' + (done.length && pass === done.length ? 'up' : done.length ? 'dn' : 'mut') + '">' + (done.length ? pass + ' von ' + L.length + ' bestanden' : L.length + ' Tests, noch nicht gelaufen') + '</b><span class="sp"></span>' + (QA.running ? '<span class="mut sm">läuft …</span>' : btnA('qarun:' + grp, 'Ausführen', 'upb')) + '</div>' +
    L.map(({ t, r }) => '<div class="li"><div class="r1">' + dot(!r ? 'mute' : r.ok ? 'ok' : 'bad') + '<span>' + E(t.name) + '</span><span class="sp"></span><span class="mut sm">' + (r ? nf(r.ms, 1) + ' ms' : '') + '</span></div>' + (r && !r.ok ? '<div class="dn sm">' + E(r.m) + '</div>' : '') + '</div>').join(''));
}
function qaSummary() { const all = TESTS.map(t => QA.res[t.grp + '|' + t.name]), d = all.filter(Boolean); return { n: TESTS.length, done: d.length, pass: d.filter(x => x.ok).length, fail: d.filter(x => !x.ok).length }; }
function vQaOverview() {
  const s = qaSummary(), g = ['unit', 'integration', 'daten', 'chaos'], nm = { unit: 'Unit-Tests', integration: 'Integration (live)', daten: 'Datenprüfung (live)', chaos: 'Ausfall-Übungen' };
  return card('Selbsttest', '<div class="best"><b class="' + (s.fail ? 'dn' : s.done === s.n ? 'up' : 'mut') + '">' + (s.done ? s.pass + ' von ' + s.n + ' bestanden' : s.n + ' Tests bereit') + '</b><div class="mut sm">Alle Tests laufen im Browser gegen den echten Code und die echten Live-Daten. Sie verändern dein Konto, Journal und deine Einstellungen nicht (Sandkasten, danach exakt zurückgestellt).</div></div>' + g.map(k => { const L = qaOf(k), d = L.filter(x => x.r), p = d.filter(x => x.r.ok).length; return '<div class="kv"><span>' + nm[k] + '</span><b class="' + (d.length ? (p === L.length ? 'up' : 'dn') : '') + '">' + (d.length ? p + ' / ' + L.length : '–') + '</b></div>'; }).join('') + '<div class="row">' + (QA.running ? '<span class="mut sm">läuft …</span>' : btnA('qarun:', 'Alle Tests ausführen', 'upb')) + '</div>') + (s.fail ? card('Fehlgeschlagen', TESTS.filter(t => QA.res[t.grp + '|' + t.name] && !QA.res[t.grp + '|' + t.name].ok).map(t => '<div class="li"><b>' + E(t.name) + '</b><div class="dn sm">' + E(QA.res[t.grp + '|' + t.name].m) + '</div></div>').join('')) : '');

    card('Nachbetrachtung', ['cause:Ursache', 'impact:Wirkung', 'fix:Behoben durch', 'lesson:Lehre / künftig anders'].map(s => { const [k, l] = s.split(':'); return '<label class="mut sm">' + l + '</label><textarea data-form="pm_' + k + '" rows="2" style="width:100%">' + E(f['pm_' + k] != null ? f['pm_' + k] : (p[k] || '')) + '</textarea>'; }).join('') + '<div class="row">' + btnA('pmsave:' + x.id, 'Speichern', 'upb') + '</div>');

    LAYERS.map(([n, ids]) => card(E(n), ids.map(id => { const m = modOf(id), k = (IMPL[id] || []).length; return '<div class="li"><div class="r1"><b>' + id + ' ' + E(m.n) + '</b><span class="sp"></span><span class="mut sm">' + k + '/' + m.s.length + '</span></div><div class="bar sm"><i style="width:' + (k / m.s.length * 100).toFixed(0) + '%"></i></div></div>'; }).join('')));

function vArchServices() { return card('Dienste in dieser App', services().map(([n, s, t]) => '<div class="li"><div class="r1">' + dot(s) + '<b>' + E(n) + '</b><span class="sp"></span><span class="' + sev(s) + ' sm">' + E(t) + '</span></div></div>').join('') + '<p class="mut sm">Alles läuft in einem Browser-Tab: kein Server, kein Container. Das ist die Grenze dieser Architektur – fürs echte Handeln braucht es später einen kleinen Dienst (Modul 25/31).</p>'); }
function vArchBus() {

}
function vArchJobs() {
  const J = Object.entries(JOBS), S = [['Engine-Takt', '1 s'], ['Oberfläche neu zeichnen', '1,5 s'], ['Verlauf speichern', '30 s'], ['Zustand speichern', '1,5 s nach Änderung'], ['Strategie-Kontrolle', '5 s'], ['Chart-Zeichnen', 'bei Bedarf (≤ 33 fps)']];
  return card('Geplante Aufgaben', S.map(s => '<div class="kv"><span>' + s[0] + '</span><b>' + s[1] + '</b></div>').join('')) + card('Messung pro Takt', J.length ? '<div class="tw"><table class="tbl"><tr><th>Aufgabe</th><th>Läufe</th><th>Ø ms</th><th>max</th><th>zuletzt</th></tr>' + J.map(([k, j]) => '<tr><td>' + E(k) + '</td><td>' + j.n + '</td><td>' + nf(mean(j.ms), 2) + '</td><td class="' + (Math.max(...j.ms) > 50 ? 'warn' : '') + '">' + nf(Math.max(...j.ms), 1) + '</td><td>' + ago(j.last) + '</td></tr>').join('') + '</table></div>' : empty('Noch keine Messwerte.'));
}
function vArchAgents() {
  return card('Agenten (Algorithmen)', ALGOS.map(a => { const c = algoCfg(a.id), S = NX.signals.filter(s => s.algo === a.id), last = S[0]; return '<div class="li"><div class="r1">' + dot(c.on ? 'ok' : 'mute') + '<b>' + E(a.name) + '</b><span class="sp"></span>' + chip2(c.on ? 'läuft' : 'aus', c.on ? 'up' : '') + '</div><div class="mut sm">' + S.length + ' Signale · letzte ' + (last ? ago(last.t) : '–') + ' · handelt mit „' + c.tv + '“ ' + (c.trade ? '' : '(Handel aus)') + '</div></div>'; }).join('') + '<p class="mut sm">Jeder Algorithmus ist ein eigenständiger Agent mit Hypothese, Parametern und eigener Auswertung (Modul 02). Weitere Agenten kommen mit Research und Discovery (Modul 20/22).</p>');

    rb: () => { const m = { healthall: () => { CONN.forEach(hcRun); logI('Verbindungstest ausgeführt'); }, reconnect: () => { connect(); logI('Verbindung neu aufgebaut'); toast('Verbinde neu …'); }, altsrc: () => { const n = ST.src === 'bnf' ? 'hl' : 'bnf'; ST.src = n; saveST(); connect(); syncUI(); emit('connector.source_changed', { src: n }); logI('Quelle gewechselt auf ' + SRC[n]); }, reconcile: () => { const r = nxReconcile(); logI('Abgleich: ' + (r.ok ? 'stimmt' : 'weicht ab')); toast(r.ok ? 'Abgleich stimmt' : 'Abgleich weicht ab', 4000); }, exp: () => { document.querySelector('[data-a="exp"]') || 0; logI('Sicherung angefordert'); const b = new Blob([nxExport()], { type: 'application/json' }), u = URL.createObjectURL(b), a2 = document.createElement('a'); a2.href = u; a2.download = 'nexus-sicherung-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }, modeoff: () => { nxSetMode('off'); logI('Modus auf „nur Signale“'); }, restoff: () => { cfgSet('flags.rest', false, 'Runbook'); logI('Markt-REST aus'); } }; if (m[arg]) m[arg](); renderNx(true); },
  };
  if (A[a] && ['iack', 'ires', 'isel', 'pmsel', 'pmsave', 'rb'].includes(a)) { e.preventDefault(); A[a](); }
