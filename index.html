<style>
:root{--bg:#07090c;--pn:#0a0d11;--line:#1a2028;--grid:#10151b;--fg:#dbe1ea;--mute:#7e8a9a;--faint:#4f5a69;--up:#2fd48a;--dn:#ff5a6b;--acc:#4da3ff;--warn:#f5a623;--font:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:12.5px/1.35 var(--font);overflow:hidden;overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
button,select,input{font:inherit;color:inherit}
#top{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--acc)}.brand svg{width:20px;height:20px}
select{background:var(--pn);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 8px}
.seg{display:inline-flex;background:var(--pn);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{background:none;border:0;border-radius:4px;height:22px;padding:0 9px;color:var(--mute);cursor:pointer;font-weight:500}
.seg button:hover{color:var(--fg)}.seg button[aria-pressed="true"]{background:#18202b;color:var(--fg);box-shadow:0 0 0 1px #243041}
.btn{background:var(--pn);border:1px solid var(--line);border-radius:6px;height:28px;padding:0 11px;cursor:pointer;color:var(--fg);font-weight:500}.btn:hover{border-color:#2b3644}.btn.sm{height:24px;padding:0 9px;font-size:11.5px}.btn.ico{width:30px;padding:0}
.pw{position:relative}
#pop[hidden]{display:none}#pop{position:absolute;top:34px;left:0;z-index:50;background:#0d1117;border:1px solid #232c38;border-radius:8px;padding:8px 10px;min-width:260px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px}
#pop .pr{display:flex;align-items:center;gap:8px;justify-content:space-between}#pop .lbl,#pop .hint{color:var(--mute);font-size:11.5px}#pop .hint{font-size:10.5px;color:var(--faint)}
.tg{display:flex;align-items:center;gap:8px;cursor:pointer}.tg input{accent-color:var(--acc);width:15px;height:15px}
#ro .ttl{color:var(--mute);font-family:var(--font);font-weight:500}
.ctl{display:flex;align-items:center;gap:10px}.seg .sh{display:none}
#stats{display:flex;align-items:center;gap:14px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.px{font:600 17px var(--mono);font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}
.chip{display:flex;flex-direction:column;line-height:1.15}.chip span{font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em}.chip b{font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.dot{width:14px;height:14px;border-radius:50%;border:0;background:var(--faint);cursor:pointer;box-shadow:0 0 0 4px rgba(255,255,255,.04)}.dot.ok{background:var(--up)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--dn)}
#main{flex:1;display:flex;min-height:0;position:relative}
#cw{flex:1;position:relative;min-width:0;cursor:crosshair;touch-action:none;user-select:none}#cw.grab{cursor:grabbing}
#cw canvas{position:absolute;left:0;top:0}#ov{pointer-events:none}
#ro{position:absolute;left:8px;top:4px;display:flex;gap:12px;font:11px var(--mono);color:var(--fg);pointer-events:none;flex-wrap:wrap;max-width:calc(100% - 80px);text-shadow:0 0 4px var(--bg)}#ro i{font-style:normal;color:var(--faint);margin-right:4px}
.fab{position:absolute;right:70px;bottom:30px;display:flex;gap:6px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(7,9,12,.7);color:var(--mute);z-index:5}#load[hidden]{display:none}
#load i{width:14px;height:14px;border:2px solid var(--faint);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
#side{width:236px;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--pn)}
#side section{display:flex;flex-direction:column;min-height:0}#dom{flex:1.25;border-bottom:1px solid var(--line)}#tape{flex:1}
.hd{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 8px;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.body{flex:1;overflow:hidden;font:11px/18px var(--mono);font-variant-numeric:tabular-nums}
.r{display:grid;grid-template-columns:1fr 1fr;padding:0 8px;position:relative;height:18px}.r span{position:relative;z-index:1}.r span:last-child{text-align:right}
#dom .r i{position:absolute;right:0;top:1px;bottom:1px;opacity:.16}#dom .r.a{color:var(--dn)}#dom .r.a i{background:var(--dn)}#dom .r.b{color:var(--up)}#dom .r.b i{background:var(--up)}#dom .r.wall span{font-weight:600}#dom .r.wall i{opacity:.34}
#dom .mid{height:24px;line-height:24px;text-align:center;font-weight:600;font-size:13px;background:#0f141b;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#dom .mid small{font-weight:400;color:var(--faint);margin-left:6px;font-size:10px}
#tape .r{grid-template-columns:62px 1fr 56px}#tape .r.b{color:var(--up)}#tape .r.a{color:var(--dn)}#tape .r.big{font-weight:600;background:rgba(255,255,255,.05)}#tape .r span:nth-child(2){text-align:right}
.empty{padding:14px 10px;color:var(--faint);text-align:center;font:11.5px var(--font)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#e6ebf2;color:#0b0e12;padding:8px 13px;border-radius:8px;font-size:12px;z-index:90;max-width:92vw;box-shadow:0 8px 30px rgba(0,0,0,.5)}#toast[hidden]{display:none}
body.noside #side{display:none}
@media (max-width:900px){
  #top{gap:6px;padding:6px 8px}.ctl{order:1;flex:1 1 0;min-width:0;flex-wrap:wrap;gap:6px}.ctl>*{flex:none}#pop{position:fixed;left:8px;right:8px}
  #sideBtn{order:2}#dot{order:3}
  .seg .lg{display:none}.seg .sh{display:inline}.seg button{padding:0 8px}
  #stats{order:9;flex:1 0 100%;margin-left:0;gap:12px}.px{font-size:15px}
  #side{position:absolute;right:0;top:0;bottom:0;z-index:20;width:228px;box-shadow:-12px 0 40px rgba(0,0,0,.6)}
  .brand span{display:none}
}
/* ===== NEXUS ===== */
:root{--card:#0c1015;--c2:#121821}

#main[hidden]{display:none}

#nxTabs{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;scrollbar-width:none;border-bottom:1px solid var(--line);flex:none}#nxTabs::-webkit-scrollbar{display:none}
.tb{flex:none;background:var(--pn);border:1px solid var(--line);color:var(--mute);border-radius:14px;padding:4px 11px;font-size:11.5px;cursor:pointer;white-space:nowrap}.tb.on{background:#18202b;color:var(--fg);border-color:#2b3b52}.tb.spec{border-style:dashed;color:var(--faint)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:10px}.card h3{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.c2{display:inline-block;border:1px solid var(--line);border-radius:10px;padding:0 7px;font-size:10.5px;line-height:17px;color:var(--mute);white-space:nowrap}.c2.up{color:var(--up);border-color:rgba(47,212,138,.35)}.c2.dn{color:var(--dn);border-color:rgba(255,90,107,.35)}.c2.warn{color:var(--warn);border-color:rgba(245,166,35,.35)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #0f141a;font-size:12px}.kv span{color:var(--mute)}.kv b{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.li{padding:8px 0;border-bottom:1px solid #0f141a;cursor:default}.li:last-child{border-bottom:0}.l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.l2{margin-top:3px;color:var(--mute);font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.rt{margin-left:auto;font:11.5px var(--mono);color:var(--mute)}.rt.up{color:var(--up)}.rt.dn{color:var(--dn)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn.upb{border-color:rgba(47,212,138,.5);color:var(--up)}.btn.dnb{border-color:rgba(255,90,107,.5);color:var(--dn)}label.btn{display:inline-flex;align-items:center;cursor:pointer}
.seg2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.seg2.sm{margin:6px 0}.seg2 button{background:var(--pn);border:1px solid var(--line);border-radius:8px;padding:7px 4px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.seg2 button b{font-weight:600;color:var(--fg)}.seg2 button small{font-size:10px;color:var(--faint)}.seg2 button.on{background:#17212e;border-color:#2f4666}
.bar{height:8px;background:#121821;border-radius:4px;overflow:hidden;margin:6px 0}.bar.sm{height:5px;margin:4px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}.bar.hot i{background:var(--warn)}
.meter{display:grid;grid-template-columns:92px 1fr auto;gap:8px;align-items:center;font-size:11.5px}.meter span{color:var(--mute)}.meter b{font:500 11.5px var(--mono)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.fl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute)}.fl.wide{grid-column:1/-1;margin-top:6px}.fl small{color:var(--faint)}
.fl input,.card input[type=text],.card input[type=number]{background:var(--pn);border:1px solid var(--line);border-radius:6px;height:30px;padding:0 8px;color:var(--fg);width:100%;font:12.5px var(--mono)}
.row .fl{flex:1;min-width:110px}
.tw{overflow-x:auto}.tbl{border-collapse:collapse;width:100%;font-size:11.5px}.tbl th{color:var(--faint);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);font-size:10.5px}.tbl td{padding:5px 6px;border-bottom:1px solid #0f141a;white-space:nowrap;font-variant-numeric:tabular-nums}.tbl td.up{color:var(--up)}.tbl td.dn{color:var(--dn)}
.tl{display:grid;grid-template-columns:64px 128px 1fr;gap:6px;padding:3px 0;font-size:11px;border-bottom:1px solid #0d1217;align-items:baseline}.tl time{color:var(--faint);font-family:var(--mono)}.tl b{font-weight:500;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}.tl span{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tl.bad b{color:var(--dn)}.tl.ok b{color:var(--up)}
.lay{margin:14px 2px 6px;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.mc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;color:var(--fg);font-size:12px}.mc small{color:var(--faint);font-family:var(--mono);margin-right:3px}.mc:hover{border-color:#2b3644}
.best{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.best b{font-size:14px}

.sv{width:100%;height:110px;display:block;margin:4px 0 8px}.sv.big{height:170px}
.ladder{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.ladder span{font-size:10.5px;border:1px dashed var(--line);color:var(--faint);border-radius:10px;padding:1px 8px}.ladder span.ok{border-style:solid;border-color:rgba(47,212,138,.4);color:var(--up)}
.h{font-weight:600}
/* Navigation unten */
#nav{display:flex;border-top:1px solid var(--line);background:#090c10;flex:none}#nav button{flex:1;background:none;border:0;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10px;cursor:pointer;position:relative}#nav svg{width:21px;height:21px}#nav button.on{color:var(--acc)}#nav button.alarm svg{color:var(--dn)}

@media (min-width:900px){#nxBody{max-width:900px;width:100%;margin:0 auto}#nxHead,#nxTabs{max-width:900px;width:100%;margin:0 auto}}
.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}

.nc{width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:4px 0 8px;background:var(--bg)}
.card{background:var(--pn);border-radius:8px;padding:8px 10px 10px}

.r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.r1 .sp{flex:1}

<script>
'use strict';
/* ===== Hilfen ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const nf = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : x.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fq = q => { const a = Math.abs(q); return a >= 1e6 ? nf(q / 1e6, 1) + 'M' : a >= 1e3 ? nf(q / 1e3, 1) + 'k' : a >= 100 ? nf(q, 0) : a >= 10 ? nf(q, 1) : a >= 1 ? nf(q, 2) : nf(q, 3); };
const fusd = x => { if (x == null || !isFinite(x)) return '–'; const a = Math.abs(x); return a >= 1e9 ? nf(x / 1e9, 2) + ' Mrd' : a >= 1e6 ? nf(x / 1e6, 1) + ' Mio' : a >= 1e3 ? nf(x / 1e3, 0) + ' Tsd' : nf(x, 0); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const niceStep = r => { const p = Math.pow(10, Math.floor(Math.log10(r))), m = r / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ohne Speicher */ } };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const SYMS = ['BTC', 'ETH', 'SOL', 'HYPE', 'XRP', 'DOGE', 'BNB', 'SUI', 'AVAX', 'LINK'];
const SRC = { bnf: 'Binance Perp', hl: 'Hyperliquid', bns: 'Binance Spot' };
const TFS = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3 };

const ST = Object.assign({ sym: 'BTC', src: 'bnf', tf: '5m', mode: 'chart', heat: true, bubbles: true, liq: true, delta: true, cvd: true, oi: true, tickMul: 0, domGroup: 1, gain: 1, bubMul: 1, side: true }, lsGet('tp:st', {}));
if (!lsGet('tp:st', null) && innerWidth < 900) { ST.side = false; ST.oi = false; }
const saveST = () => lsSet('tp:st', ST);
/* Messpunkte für Observability (Modul 13) / API-Verwaltung (Modul 16) */
const OBS = { rest: {}, ws: {}, nT: 0, nM: 0, resync: 0, reconn: 0, errs: [], draw: [], ts: [], alerts: [], tick: 0, saveOk: 0, saveErr: 0, t0: Date.now() };
function obsRest(h, ms, ok, st) { const r = OBS.rest[h] || (OBS.rest[h] = { n: 0, err: 0, ms: [], at: [], last: 0, lastErr: '' }); r.n++; if (!ok) { r.err++; r.lastErr = 'HTTP ' + st; } r.ms.push(ms); if (r.ms.length > 100) r.ms.shift(); const now = Date.now(); r.at.push([now, ok ? 1 : 0]); while (r.at.length && now - r.at[0][0] > 60000) r.at.shift(); r.last = now; }
addEventListener('error', e => { OBS.errs.unshift({ t: Date.now(), m: String(e.message || e) }); if (OBS.errs.length > 50) OBS.errs.length = 50; });
addEventListener('unhandledrejection', e => { OBS.errs.unshift({ t: Date.now(), m: 'Promise: ' + String(e.reason && e.reason.message || e.reason) }); if (OBS.errs.length > 50) OBS.errs.length = 50; });
OBS.brk = {};
const JOBS = {};
function jt(n, f) { const t0 = performance.now(); try { return f(); } finally { const j = JOBS[n] || (JOBS[n] = { n: 0, ms: [], last: 0 }); j.n++; j.last = Date.now(); j.ms.push(performance.now() - t0); if (j.ms.length > 60) j.ms.shift(); } }
let toastT = null;
function toast(m, ms = 4000) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, ms); }

'use strict';
/* ===== Datenspeicher (alles im Browser, direkt von den Börsen) ===== */
const CAP = 400000;
const D = {
  candles: [], tfMs: TFS['5m'], hb: 1, base: 1,
  ring: { t: new Float64Array(CAP), p: new Float64Array(CAP), q: new Float32Array(CAP), s: new Int8Array(CAP), w: 0, len: 0 },
  dmap: new Map(),                 // Kerzenzeit -> [Verkauf, Kauf] (aus Trades)
  fp: { tick: 0, map: new Map() }, // Footprint: Kerzenzeit -> Map(Preisindex -> [Verkauf, Kauf])
  heat: [], bubbles: [], liqs: [], oi: [], tape: [], secs: [], thrC: { t: 0, v: 0 },
  last: null, stats: {}, feed: null, gen: 0, book: null, lastMsg: 0, pend: {},
};
function resetData(keep) {
  D.candles = []; D.dmap = new Map(); D.fp = { tick: 0, map: new Map() }; D.tfMs = TFS[ST.tf];
  if (keep) { dmapRebuild(); return; }          // gleicher Markt, nur anderer Zeitrahmen: Trades, Heatmap, Blasen bleiben
  D.ring.w = 0; D.ring.len = 0; D.heat = []; D.bubbles = []; D.liqs = []; D.oi = []; D.tape = []; D.secs = []; D.last = null; D.stats = {}; D.book = null; D.pend = {};
}
const rIdx = i => (D.ring.w - D.ring.len + i + CAP) % CAP;    // i-ter Trade in Zeitfolge
function ringPush(t, p, q, s) { const r = D.ring; r.t[r.w] = t; r.p[r.w] = p; r.q[r.w] = q; r.s[r.w] = s; r.w = (r.w + 1) % CAP; if (r.len < CAP) r.len++; }

/* Grundtick je Preisniveau */
function baseTick(p) { return niceStep(p * 1e-5); }
function heatBucket(p) { return niceStep(p * 4e-5); }

/* Footprint */
function fpAdd(t, p, q, s) {
  const ct = Math.floor(t / D.tfMs) * D.tfMs; let m = D.fp.map.get(ct); if (!m) { m = new Map(); D.fp.map.set(ct, m); }
  const k = Math.floor(p / D.fp.tick + 1e-9); let c = m.get(k); if (!c) { c = [0, 0]; m.set(k, c); } c[s > 0 ? 1 : 0] += q;
}
function fpRebuild(tick) {
  D.fp = { tick, map: new Map() }; const r = D.ring;
  for (let i = 0; i < r.len; i++) { const j = rIdx(i); fpAdd(r.t[j], r.p[j], r.q[j], r.s[j]); }
}
function dmapAdd(t, q, s) { const ct = Math.floor(t / D.tfMs) * D.tfMs; let c = D.dmap.get(ct); if (!c) { c = [0, 0]; D.dmap.set(ct, c); } c[s > 0 ? 1 : 0] += q; }
function dmapRebuild() { D.dmap = new Map(); const r = D.ring; for (let i = 0; i < r.len; i++) { const j = rIdx(i); dmapAdd(r.t[j], r.q[j], r.s[j]); } }
function rebucket() { dmapRebuild(); if (D.fp.tick) fpRebuild(D.fp.tick); }
/* Delta einer Kerze: bevorzugt Börsenwert (Binance taker-buy), sonst aus eigenen Trades */
function deltaOf(c) { if (c.d != null) return c.d; const m = D.dmap.get(c.t); return m ? m[1] - m[0] : null; }
function volsOf(c) { const m = D.dmap.get(c.t); return m ? m : null; }

/* ===== Eingänge (werden von den Feeds aufgerufen) ===== */
const BUB_BASE = { BTC: 3e5, ETH: 1.5e5, SOL: 8e4, HYPE: 6e4 };
function onTrade(t, p, q, s, backfill) {
  ringPush(t, p, q, s); dmapAdd(t, q, s); if (D.fp.tick) fpAdd(t, p, q, s);
  /* Blasen: Netto je Sekunde und Seite */
  const sec = Math.floor(t / 1000), k = sec + (s > 0 ? 'b' : 's'); let pd = D.pend[k];
  if (!pd) { for (const kk in D.pend) { const o = D.pend[kk]; if (o.sec < sec - 1) { const thr = (BUB_BASE[ST.sym] || 1e5); D.secs.push(o.usd); if (D.secs.length > 1500) D.secs.shift(); if (o.usd >= thr * 0.15) D.bubbles.push({ t: o.sec * 1000 + 500, p: o.pq / o.q, usd: o.usd, s: o.s }); delete D.pend[kk]; } } pd = D.pend[k] = { sec, s, usd: 0, pq: 0, q: 0 }; }
  pd.usd += p * q; pd.pq += p * q; pd.q += q;
  if (D.bubbles.length > 6000) D.bubbles.splice(0, 1000);
  if (!backfill) {
    D.last = { t, p, s }; D.lastMsg = Date.now(); OBS.nT++; const lt = D.lastMsg - t; if (lt > -5000 && lt < 60000) { (D.lat = D.lat || []).push(lt); if (D.lat.length > 300) D.lat.shift(); }
    D.tape.push({ t, p, q, s }); if (D.tape.length > 80) D.tape.shift();
  }
}
function onCandles(arr) { D.candles = arr; if (arr.length) { const pr = arr[arr.length - 1].c; D.base = baseTick(pr); D.hb = heatBucket(pr); } }
function onCandle(c) {
  const a = D.candles, l = a[a.length - 1];
  if (!l || c.t > l.t) { a.push(c); if (a.length > 3000) a.shift(); } else if (c.t === l.t) a[a.length - 1] = c; else { const i = a.findIndex(x => x.t === c.t); if (i >= 0) a[i] = c; }
  D.lastMsg = Date.now(); if (!D.last) D.last = { t: c.t, p: c.c, s: 0 };
}
function onLiq(ev) { D.liqs.push(ev); if (D.liqs.length > 2000) D.liqs.shift(); }
function onStats(o) { Object.assign(D.stats, o); if (o.oiUsd != null) { const l = D.oi[D.oi.length - 1], t = Date.now(); if (!l || t - l.t > 15e3) D.oi.push({ t, v: o.oiUsd }); if (D.oi.length > 5000) D.oi.shift(); } }
function onOIHist(rows) { const keep = D.oi.filter(x => !rows.length || x.t > rows[rows.length - 1].t); D.oi = rows.concat(keep); }

/* Heatmap-Spalte aus dem aktuellen Orderbuch (1 Hz) */
function sampleHeat() {
  if (NX.flags && NX.flags.heat === false) return; const f = D.feed; if (!f || !f.getBook) return;
  const bk = f.getBook(); if (!bk || !bk.bids.length || !bk.asks.length) return;
  D.book = bk; const mid = (bk.bids[0][0] + bk.asks[0][0]) / 2, hb = D.hb, m = new Map(), rng = mid * 0.012;
  const add = (arr) => { for (let i = 0; i < arr.length; i++) { const [p, q] = arr[i]; if (Math.abs(p - mid) > rng) continue; const step = bk.step;
    if (step && step > hb * 1.5) { const n = Math.max(1, Math.round(step / hb)), b0 = Math.floor((p - step / 2) / hb), v = p * q / n; for (let k = 0; k < n; k++) m.set(b0 + k, (m.get(b0 + k) || 0) + v); }
    else { const b = Math.floor(p / hb); m.set(b, (m.get(b) || 0) + p * q); } } };
  add(bk.bids); add(bk.asks);
  const idx = new Int32Array(m.size), val = new Float32Array(m.size); let i = 0; for (const [k, v] of m) { idx[i] = k; val[i++] = v; }
  D.heat.push({ t: Date.now(), mid, idx, val }); if (D.heat.length > 7200) D.heat.splice(0, 600);
}

/* Blasen-Schwelle: adaptiv (oberes Dreißigstel der Sekunden-Umsätze der letzten Minuten), mindestens ein Sockelwert */
function bubThr() {
  const now = Date.now(); if (now - D.thrC.t < 4000 && D.thrC.v) return D.thrC.v / ST.bubMul;
  const base = (BUB_BASE[ST.sym] || 1e5) * 0.5; let v = base;
  if (D.secs.length > 60) { const a = D.secs.slice().sort((x, y) => x - y); v = Math.max(base, a[Math.floor(a.length * 0.97)]); }
  D.thrC = { t: now, v }; return v / ST.bubMul;
}

'use strict';
/* ===== Börsen-Anbindung: direkt aus dem Browser (öffentliche Daten, keine Schlüssel) ===== */
const jget = async (u, o) => { const t0 = performance.now(), h = u.split('/')[2]; let r; if (OBS.brk && OBS.brk[h] > Date.now()) throw new Error(h + ' → Leistungsschalter offen'); try { r = await fetch(u, o); } catch (e) { obsRest(h, performance.now() - t0, false, 0); throw e; } obsRest(h, performance.now() - t0, r.ok, r.status); if (!r.ok) throw new Error(u.split('?')[0] + ' → HTTP ' + r.status); return r.json(); };

/* WebSocket mit Wiederverbindung und Ausweich-Adressen */
class WS {
  constructor(urls, onmsg, onopen, onstate) { this.urls = urls; this.onmsg = onmsg; this.onopen = onopen; this.onstate = onstate || (() => {}); this.n = 0; this.dead = false; this.ui = 0; this.connect(); }
  connect() {
    if (this.dead) return;
    const url = this.urls[this.ui % this.urls.length]; let ws, opened = false;
    try { ws = new WebSocket(url); } catch (e) { this.retry(); return; }
    this.ws = ws; this.onstate('verbinde');
    ws.onopen = () => { opened = true; this.n = 0; this.onstate('ok'); this.onopen && this.onopen(ws); };
    ws.onmessage = e => { OBS.nM++; const wh = url.split('/')[2], w = OBS.ws[wh] || (OBS.ws[wh] = { n: 0, conn: 0, last: 0 }); w.n++; w.last = Date.now(); try { this.onmsg(JSON.parse(e.data)); } catch (err) { /* unbekannte Nachricht ignorieren */ } };
    ws.onclose = () => { if (this.dead) return; OBS.reconn++; (OBS.ws[url.split('/')[2]] || (OBS.ws[url.split('/')[2]] = { n: 0, conn: 0, last: 0 })).conn++; this.onstate('getrennt'); if (!opened) this.ui++; this.retry(); };
    ws.onerror = () => { try { ws.close(); } catch (e) { /* */ } };
  }
  retry() { if (this.dead) return; this.n++; setTimeout(() => this.connect(), Math.min(10000, 500 * Math.pow(1.7, this.n))); }
  send(o) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(o)); }
  close() { this.dead = true; try { this.ws && this.ws.close(); } catch (e) { /* */ } }
}

/* ---------- Binance (Perp oder Spot) ---------- */
class BinanceFeed {

/* Orderbuch-Leiter */
function renderDOM() {
  const el = $('#dom .body'); if (!el || !ST.side) return; const f = D.feed, bk = f && f.getBook && f.getBook(); if (!bk) { el.innerHTML = '<div class="empty">Orderbuch lädt …</div>'; return; }
  const mid = (bk.bids[0][0] + bk.asks[0][0]) / 2, g = Math.max(bk.step || 0, D.base * (ST.domGroup || 1)), rows = Math.max(6, Math.floor(el.clientHeight / 18 / 2) - 1), dec = g >= 1 ? 0 : g >= .1 ? 1 : 2;
  const agg = (arr, up) => { const m = new Map(); for (const [p, q] of arr) { const k = up ? Math.ceil(p / g - 1e-9) : Math.floor(p / g + 1e-9); m.set(k, (m.get(k) || 0) + q); } return [...m].sort((a, b) => up ? a[0] - b[0] : b[0] - a[0]).slice(0, rows); };
  const A = agg(bk.asks, true), B = agg(bk.bids, false), all = A.concat(B).map(x => x[1]), mx = Math.max(...all, 1e-9), med = all.slice().sort((a, b) => a - b)[all.length >> 1] || 1;
  const row = ([k, q], side) => '<div class="r ' + side + (q >= med * 4 ? ' wall' : '') + '"><i style="width:' + Math.round(q / mx * 100) + '%"></i><span>' + nf(k * g, dec) + '</span><span>' + fq(q) + '</span></div>';
  el.innerHTML = A.slice().reverse().map(x => row(x, 'a')).join('') + '<div class="mid">' + nf(mid, dec + 1 > 3 ? 3 : dec + 1) + '<small>' + nf((bk.asks[0][0] - bk.bids[0][0]) / mid * 1e4, 1) + ' bp</small></div>' + B.map(x => row(x, 'b')).join('');
}

}

/* ----- Ereignisse (ein Handler für alle Aktionen) ----- */
function armed(key) { const a = NXV.arm; return a && a.key === key && Date.now() - a.t < 4000; }
function arm(key) { NXV.arm = { key, t: Date.now() }; renderNx(true); setTimeout(() => renderNx(true), 4100); }
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]'); if (!t || !$('#nxView').contains(t)) return; const [a, ...r] = t.dataset.a.split(':'), arg = r.join(':');
  const A = {
    wlsel: () => { if (ST.sym !== arg) { ST.sym = arg; saveST(); connect(); syncUI(); } go('tape'); },
    go: () => { go(arg); }, tab: () => { NXV.tab[NXV.cur] = +arg; renderNx(true); },
    mode: () => { nxSetMode(arg); renderNx(true); },
    kill: () => { if (arg === 'on') { if (!armed('kill')) return arm('kill'); nxKill(true, 'manuell', false); } else nxKill(false); renderNx(true); },
    killclose: () => { if (!armed('killc')) return arm('killc'); nxKill(true, 'manuell', true); renderNx(true); },
    approve: () => { nxApprove(arg); renderNx(true); }, reject: () => { nxReject(arg); renderNx(true); },
    close: () => { nxClose(arg, 'Manuell'); renderNx(true); }, closeall: () => { if (!armed('closeall')) return arm('closeall'); NX.pos.slice().forEach(p => nxClose(p.id, 'Manuell')); renderNx(true); },
    manual: () => { const f = NXV.form; nxManual(arg, parseFloat(String(f.stop).replace(',', '.')), parseFloat(String(f.target).replace(',', '.'))); renderNx(true); },
    open: () => { NXV.open[arg] = !NXV.open[arg]; renderNx(true); },
    algoon: () => { const c = algoCfg(arg); cfgSet('algos.' + arg + '.on', !c.on, 'Lab'); renderNx(true); },
    algotrade: () => { const c = algoCfg(arg); cfgSet('algos.' + arg + '.trade', !c.trade, 'Lab'); renderNx(true); },
    tv: () => { const [id, v] = arg.split(':'); algoCfg(id); cfgSet('algos.' + id + '.tv', v, 'Lab'); renderNx(true); },
    replay: () => { NXV.replay = arg; renderNx(true); },
    tagt: () => { const [id, tg] = arg.split(':'), c = NX.closed.find(x => x.id === id); if (c) { c.tag = c.tag === tg ? '' : tg; emit('journal.tagged', { id, tag: c.tag }); } renderNx(true); },
    hypadd: () => { const f = NXV.form; if (!f.hyp || !f.hyp.trim()) return; NX.hyp.unshift({ id: nid('H'), t: Date.now(), text: f.hyp.trim(), falsif: (f.fal || '').trim(), st: 'offen' }); f.hyp = ''; f.fal = ''; emit('hypothesis.registered', { text: NX.hyp[0].text }); renderNx(true); },
    hypst: () => { const [id, s] = arg.split(':'), h = NX.hyp.find(x => x.id === id); if (h) { h.st = s; emit('hypothesis.' + (s === 'verworfen' ? 'rejected' : s === 'bestätigt' ? 'confirmed' : 'reopened'), { id }); } renderNx(true); },
    tlf: () => { NXV.tlf = arg; renderNx(true); },
    exp: () => { const b = new Blob([nxExport()], { type: 'application/json' }), u = URL.createObjectURL(b), a2 = document.createElement('a'); a2.href = u; a2.download = 'nexus-sicherung-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a2); a2.click(); a2.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); emit('backup.exported', {}); },
    learn: () => { const s = (NXV.sugg || [])[+arg]; if (s && s.apply) { s.apply(); NXV.sugg = null; } renderNx(true); },
    reset: () => { if (!armed('reset')) return arm('reset'); NX.pos = []; NX.closed = []; NX.orders = []; NX.decisions = []; NX.acct.realized = 0; NX.acct.fees = 0; NX.acct.archived = 0; NX.acct.since = Date.now(); NX.pause = { until: 0, why: '' }; emit('account.reset', { eq0: NX.acct.eq0 }); renderNx(true); },
    cfgundo: () => { cfgRollback(+arg); renderNx(true); },
    costreset: () => { NX.risk = Object.assign(NX.risk, RISK_DEF); emit('config.reset', {}); renderNx(true); },
  };
  if (A[a]) { e.preventDefault(); A[a](); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!$('#nxView').contains(t) && t.id !== 'impf') return;
  if (t.id === 'impf') { const f = t.files[0]; if (f) f.text().then(nxImport).catch(x => toast('Einspielen fehlgeschlagen: ' + x.message, 6000)); return; }
  if (t.dataset.cfg) { const f = CFG.find(x => x.path === t.dataset.cfg); let v = parseFloat(String(t.value).replace(',', '.')); if (!isFinite(v) || !f) { renderNx(true); return; } v = clamp(v, f.min, f.max); cfgSet(t.dataset.cfg, v, 'manuell'); renderNx(true); }
  if (t.dataset.form) { NXV.form[t.dataset.form] = t.value; if (t.dataset.rr) setTimeout(() => renderNx(true), 0); }
});

/* ----- Statistik ----- */
function perf(list) {
  const n = list.length, w = list.filter(c => c.pnl > 0), l = list.filter(c => c.pnl <= 0), gp = w.reduce((x, c) => x + c.pnl, 0), gl = -l.reduce((x, c) => x + c.pnl, 0), chron = list.slice().reverse();
  let eq = NX.acct.eq0, pk = eq, dd = 0; const curve = [eq]; for (const c of chron) { eq += c.pnl; curve.push(eq); pk = Math.max(pk, eq); dd = Math.max(dd, (pk - eq) / pk); }
  return { n, win: n ? w.length / n : 0, avgR: mean(list.map(c => c.R)), pnl: list.reduce((x, c) => x + c.pnl, 0), pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0), dd, curve, fees: list.reduce((x, c) => x + c.fees, 0) };
}
const healthC = () => ({ ok: 'up', warn: 'warn', bad: 'dn' })[health()];

function incTick() {
  NX.inc = NX.inc || []; if (!NX.incInit) { NX.incInit = true; NX.incSeen = NX.events.length ? NX.events[0].i : 0; } const now = Date.now(), seen = NX.incSeen, ev = NX.events.filter(e => e.i > seen).reverse();
  for (const e of ev) {
    for (const [type, sv, key0, ttl] of INC_RULES) if (e.type === type) {
      if (type === 'ops.alert' && e.d.k === 'brk') continue;
      let key = key0.endsWith(':') ? key0 + (e.d.k || e.d.host) : key0, sev = sv || ((OBS.alerts.find(a => a.k === e.d.k) || {}).sev || 'warn');
      if (!NX.inc.some(x => x.key === key && x.st !== 'gelöst')) { const inc = { id: nid('V'), t: e.t, key, sev, title: ttl(e), st: 'offen', ack: 0, res: 0, log: [{ t: e.t, txt: 'Automatisch erkannt (Ereignis #' + e.i + ')' }], pm: null, ev: e.i }; NX.inc.unshift(inc); if (NX.inc.length > 200) NX.inc.length = 200; emit('inc.opened', { id: inc.id, title: inc.title, sev }); if (sev === 'bad') toast('Vorfall: ' + inc.title, 6000); }
    }
    const rk = RES_RULES[e.type]; if (rk) { const k = rk(e); for (const x of NX.inc.filter(x => x.key === k && x.st !== 'gelöst')) incResolve(x, 'automatisch: Ursache beendet'); }
  }
  NX.incSeen = NX.events.length ? NX.events[0].i : seen;
  for (const x of NX.inc.filter(x => x.key === 'pause' && x.st !== 'gelöst')) if (NX.pause.until < now) incResolve(x, 'automatisch: Pause vorbei');
  for (const x of NX.inc.filter(x => x.key.startsWith('brk:') && x.st !== 'gelöst')) if (!(OBS.brk[x.key.slice(4)] > now)) incResolve(x, 'automatisch: Leistungsschalter wieder zu');
  /* Selbstheilung: Datenstrom bei offener Warnung neu verbinden (höchstens alle 2 min) */
  const st = OBS.alerts.find(a => a.k === 'stale' && !a.t1);
  if (st && NX.flags.autoHeal !== false && now - st.t0 > 45000 && now - (incTick.heal || 0) > 120000) { incTick.heal = now; emit('ops.remediation', { what: 'Neu verbinden (Datenstrom veraltet)' }); const inc = NX.inc.find(x => x.key === 'alert:stale' && x.st !== 'gelöst'); if (inc) inc.log.push({ t: now, txt: 'Selbstheilung: Verbindung neu aufgebaut' }); try { connect(); } catch (e) { /* */ } }
  const urgent = NX.inc.some(x => x.sev === 'bad' && x.st === 'offen'); document.title = (urgent ? '(!) ' : '') + TITLE0;
  if (urgent && now - (incTick.nag || 0) > 300000 && NX.inc.some(x => x.sev === 'bad' && x.st === 'offen' && now - x.t > 300000)) { incTick.nag = now; toast('Schwerer Vorfall wartet seit > 5 min auf dich', 7000); }
}
function incResolve(x, how) { if (x.st === 'gelöst') return; x.st = 'gelöst'; x.res = Date.now(); x.log.push({ t: x.res, txt: how || 'gelöst' }); emit('inc.resolved', { id: x.id, how: how || 'manuell' }); }
function safety() {
  const now = Date.now(), R = [], hi = (l, t) => R.push([l, t]), act = OBS.alerts.filter(a => !a.t1);
  if (NX.kill) hi(3, 'Kill-Switch aktiv (' + NX.killWhy + ')'); if (NX.pause.until > now) hi(2, 'Pause bis ' + tm(NX.pause.until) + ' (' + NX.pause.why + ')'); if (D.feed && D.lastMsg && now - D.lastMsg > NX.risk.staleMs) hi(2, 'Daten veraltet'); if (ddScale() === 0) hi(2, 'Drawdown-Pause'); else if (ddScale() < 1) hi(1, 'Drawdown-Kontrolle reduziert Größe ×' + ddScale());

'use strict';
/* ===== Server-Übergabe =====
   Nur aktiv, wenn die App vom eigenen Server kommt (window.__SERVER). Der Server lässt die Engine rund um die Uhr laufen.
   Öffnest du die App, übernimmt das Handy die Steuerung (Stand vom Server); beim Schließen geht sie zurück.
   Es steuert immer genau einer: Handy ODER Server – nie beide gleichzeitig. */
const SRV = { on: !!window.__SERVER, eng: !!window.__ENGINE, ok: false, local: false, dead: '', tok: '', err: '', pushAt: 0, pushes: 0, kb: 0, sig: '', beatAt: 0, busy: false };

async function srvFetch(path, body, gz) {
  const opt = { method: 'POST', credentials: 'same-origin', headers: { 'x-ctl': SRV.tok } };
  if (body !== undefined) {
    const txt = JSON.stringify(body);
    if (gz && typeof CompressionStream === 'function') { opt.body = await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).blob(); opt.headers['x-gz'] = '1'; }
    else opt.body = txt;
    opt.headers['content-type'] = 'application/json'; SRV.kb = Math.round((opt.body.size || opt.body.length) / 102.4) / 10;
  }
  return fetch(path, opt);
}

function srvAsk(msg, buttons) {
  return new Promise(res => {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#07090c;color:#e8eef5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px system-ui,sans-serif';
    const b = document.createElement('b'); b.textContent = msg; d.append(b);
    for (const [k, label] of buttons) { const x = document.createElement('button'); x.textContent = label; x.style.cssText = 'padding:12px 20px;border-radius:10px;border:1px solid #2a3340;background:#121820;color:#e8eef5;font:inherit'; x.onclick = () => { d.remove(); res(k); }; d.append(x); }
    document.body.append(d);
  });
}

/* Beim Start: Steuerung vom Server übernehmen (vor dem Laden des lokalen Stands) */
async function srvTake() {
  if (!SRV.on || SRV.eng) return;
  for (;;) {
    try {
      const r = await srvFetch('/api/take', {});
      if (r.status === 401) { location.href = '/login'; await new Promise(() => {}); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const o = await r.json(); SRV.tok = o.tok;
      if (o.nx) await idbPut('nexus', o.nx);                 // Server hat Stand → ersetzt den lokalen
      if (o.st) { for (const k of ['sym', 'src', 'tf']) if (o.st[k]) ST[k] = o.st[k]; saveST(); }
      SRV.ok = true; SRV.err = ''; SRV.sig = o.nx ? '' : 'first'; return;
    } catch (e) {
      SRV.err = String(e && e.message || e);
      const c = await srvAsk('Server nicht erreichbar (' + SRV.err + ')', [['retry', 'Erneut versuchen'], ['local', 'Lokal weiterarbeiten (ohne Server, Stand wird später verworfen)']]);
      if (c === 'local') { SRV.local = true; return; }
    }
  }
}

function srvSig() { const h = NX.events && NX.events[0] ? NX.events[0].h : '0'; return h + '|' + NX.pos.length + '|' + ST.sym + '|' + ST.src + '|' + ST.tf; }
function srvPayload() {
  const o = JSON.parse(JSON.stringify(NX)); o.signals = o.signals.slice(0, 600); o.decisions = o.decisions.slice(0, 400); o.orders = o.orders.slice(0, 400); o.closed = o.closed.slice(0, 500);
  return { nx: o, st: { sym: ST.sym, src: ST.src, tf: ST.tf } };
}

/* Steuerung verloren: 'lease' = Server hat nach Pause übernommen → neu laden (holt den neuen Stand); 'other' = anderes Gerät → nachfragen */
async function srvLost(why) {
  if (SRV.dead) return; SRV.dead = why || 'lease';
  if (SRV.dead === 'lease') { location.reload(); return; }
  await srvAsk('Ein anderes Gerät steuert gerade.', [['take', 'Hier übernehmen']]); location.reload();
}
async function srvCheck(r) {
  if (r.status === 401) { location.href = '/login'; return false; }
  if (r.status === 409) { let j = {}; try { j = await r.json(); } catch (e) { /* leer */ } srvLost(j.why); return false; }
  return r.ok;
}

async function srvPush(force) {
  if (!SRV.ok || SRV.busy || SRV.dead) return; const sig = srvSig(); if (!force && sig === SRV.sig) return;
  SRV.busy = true;
  try { const r = await srvFetch('/api/push', srvPayload(), true); if (await srvCheck(r)) { SRV.sig = sig; SRV.pushAt = Date.now(); SRV.pushes++; SRV.err = ''; } else if (!r.ok && r.status !== 409) SRV.err = 'Push HTTP ' + r.status; }
  catch (e) { SRV.err = 'Push: ' + (e && e.message || e); }
  SRV.busy = false;
}
async function srvBeat() {
  if (!SRV.ok || SRV.dead) return;
  try { const r = await srvFetch('/api/beat'); if (await srvCheck(r)) { SRV.beatAt = Date.now(); SRV.err = ''; } }
  catch (e) { SRV.err = 'Verbindung: ' + (e && e.message || e); }
}

if (SRV.on && !SRV.eng) {
  setInterval(() => { if (!document.hidden) { srvBeat(); srvPush(false); } }, 10000);
  document.addEventListener('visibilitychange', () => { if (!SRV.ok) return; if (document.hidden) srvPush(true); else { srvBeat(); } });
  addEventListener('pagehide', () => { if (SRV.ok && !SRV.dead) { try { navigator.sendBeacon('/api/release?t=' + encodeURIComponent(SRV.tok)); } catch (e) { /* egal */ } } });
  /* Datei-Einspielen: erst auf den Server, dann lokal (sonst würde der Server-Stand nach dem Neuladen zurückkommen) */
  const _imp = nxImport;
  nxImport = async function (txt) {
    if (SRV.ok) { const o = JSON.parse(txt); if (!o || !o.state || o.state.v !== 1) throw new Error('Datei passt nicht'); const r = await srvFetch('/api/push', { nx: o.state, st: { sym: ST.sym, src: ST.src, tf: ST.tf } }, true); if (!r.ok) throw new Error('Server hat die Datei nicht angenommen (HTTP ' + r.status + ')'); }
    return _imp(txt);
  };
}
